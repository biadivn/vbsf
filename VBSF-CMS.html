function renderSingletonForm(key, fields){
  const data = DB[key];
  let html = `<div class="form-card"><div class="form-grid">`;
  fields.forEach(f=>{
    html += `<div class="fld ${f.span2?'span2':''}"><label>${f.label}</label>${renderField(f, data[f.key])}</div>`;
  });
  html += `</div><div class="form-actions"><button class="btn btn-primary" id="saveSingleton"><i class="ti ti-check"></i> Lưu thay đổi</button></div></div>`;
  return html;
}
function attachSingletonEvents(key, fields){
  document.getElementById('saveSingleton').addEventListener('click', async ()=>{
    const data = {};
    fields.forEach(f=>{
      const el = document.getElementById('f_'+f.key);
      data[f.key] = f.type==='checkbox' ? el.classList.contains('on') : el.value;
    });
    const ok = await saveSingletonToApi(key, data);
    if(!ok) return;
    DB[key] = data;
    showToast('Đã lưu thay đổi');
    renderSidebar();
  });
}


/* =========================================================
   PAGES LIST VIEW
   ========================================================= */
function renderPagesListView(){
  const pageKeys = getAllPageKeys();
  const term = searchTerm.toLowerCase();
  const rows = pageKeys.filter(k=> !term || getPageLabel(k).toLowerCase().includes(term) || getPagePath(k).toLowerCase().includes(term));

  let html = `<div class="toolbar">
    <div class="search"><i class="ti ti-search"></i><input type="text" id="searchInput" placeholder="Tìm theo tên trang..." value="${escapeAttr(searchTerm)}"></div>
    <span class="count-pill">${rows.length} / ${pageKeys.length} trang</span>
  </div>`;

  if(rows.length===0){
    html += `<div class="tbl-wrap"><div class="empty"><i class="ti ti-layout-2"></i><b>Không tìm thấy trang</b>Không có trang nào khớp với tìm kiếm.</div></div>`;
    return html;
  }

  html += `<div class="tbl-wrap"><table><thead><tr>
    <th>Tên trang</th><th>Section</th><th style="width:90px"></th>
  </tr></thead><tbody>`;
  rows.forEach(k=>{
    const cfg = DB.pageSections[k] || [];
    const total = cfg.length;
    const enabled = cfg.filter(s=>s.enabled).length;
    const customTag = DB.customPages[k] ? `<span class="badge" style="margin-left:6px">Tùy chỉnh</span>` : '';
    html += `<tr data-page-row="${k}" style="cursor:pointer">
      <td>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:34px;height:34px;border-radius:8px;background:var(--tag-purple-soft);color:var(--tag-purple);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0"><i class="ti ${getPageIcon(k)}"></i></span>
          <div>
            <div style="font-weight:600">${escapeHtml(getPageLabel(k))}${customTag}</div>
            <div class="cell-muted" style="font-size:12px">${escapeHtml(getPagePath(k))}</div>
          </div>
        </div>
      </td>
      <td><span class="cell-muted">${enabled} / ${total} section đang bật</span></td>
      <td class="actions"><button class="btn-icon" data-edit-page="${k}" title="Mở trang"><i class="ti ti-edit"></i></button></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}
function attachPagesListEvents(){
  const search = document.getElementById('searchInput');
  if(search){
    search.addEventListener('input', e=>{ searchTerm = e.target.value; renderContent(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').setSelectionRange(searchTerm.length,searchTerm.length); });
  }
  document.querySelectorAll('[data-page-row]').forEach(tr=>{
    tr.addEventListener('click', ()=> setView('page:'+tr.getAttribute('data-page-row')));
  });
  document.querySelectorAll('[data-edit-page]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); setView('page:'+btn.getAttribute('data-edit-page')); });
  });
}


/* =========================================================
   PAGE SECTIONS VIEW (mô phỏng)
   ========================================================= */
function renderPageSectionsView(){
  const pageKey = currentView.slice(5);
  const registry = getSectionCatalog(pageKey);
  const cfg = DB.pageSections[pageKey];

  if(!activeSectionKey || !cfg.find(s=>s.key===activeSectionKey)){
    activeSectionKey = cfg[0] ? cfg[0].key : null;
  }
  if(activeSectionKey) ensureSectionEditBuffer(pageKey, activeSectionKey);

  const listRows = cfg.map((s, idx)=>{
    const def = registry.find(r=>r.key===s.key) || {};
    const apiBadge = def.apiIntegrated ? `<i class="ti ti-api" style="color:var(--tag-purple);font-size:12px" title="Tích hợp API"></i>` : '';
    const selected = s.key===activeSectionKey ? 'selected' : '';
    return `<div class="sec-row ${selected}" data-select-section="${s.key}">
      <div class="sec-row-order">
        <button class="btn-icon" data-move-up="${idx}" ${idx===0?'disabled style="opacity:.3"':''} title="Lên"><i class="ti ti-chevron-up"></i></button>
        <button class="btn-icon" data-move-down="${idx}" ${idx===cfg.length-1?'disabled style="opacity:.3"':''} title="Xuống"><i class="ti ti-chevron-down"></i></button>
      </div>
      <span class="switch ${s.enabled?'on':''}" data-enable-input="${s.key}" title="${s.enabled?'Đang hiển thị':'Đang ẩn'}"></span>
      <span class="sec-row-label">${escapeHtml(getSectionLabel(pageKey, s.key))}</span>${apiBadge}
      <button class="btn-icon" data-rename-section="${s.key}" title="Đổi tên section" style="flex-shrink:0"><i class="ti ti-pencil"></i></button>
      <button class="btn-icon" data-remove-section="${s.key}" title="Xóa khỏi trang" style="flex-shrink:0"><i class="ti ti-trash"></i></button>
    </div>`;
  }).join('');

  return `<div data-back-to-pages style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:14px">
      <i class="ti ti-arrow-left"></i> Tất cả trang
    </div>
    ${renderPageMetaCard(pageKey)}
    <div class="sec-builder">
      <div class="card sec-list-card">
        <div class="card-head">
          <div>
            <h2>Section</h2>
            <div class="desc">${cfg.filter(s=>s.enabled).length}/${cfg.length} section đang hiển thị</div>
          </div>
        </div>
        <div class="sec-list">${listRows || '<div class="empty" style="padding:24px"><b>Chưa có section nào</b></div>'}</div>
        <div data-add-section style="padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;color:var(--vg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px"><i class="ti ti-plus"></i> Thêm section</div>
      </div>
      <div class="card sec-detail-card" id="secDetailCard">
        ${renderSectionDetailPanel(pageKey, activeSectionKey)}
      </div>
    </div>`;
}

/* ---- Thẻ "Thông tin trang" (tên, slug, metadata) ngay trong màn hình chi tiết ---- */
let pageMetaEditBuffer = null;
function ensurePageMetaEditBuffer(pageKey){
  if(pageMetaEditBuffer && pageMetaEditBuffer.pageKey===pageKey) return;
  const meta = DB.pageMeta[pageKey] || {};
  pageMetaEditBuffer = {pageKey, values:{
    title: meta.title || getPageLabel(pageKey),
    slug: meta.slug || getPagePath(pageKey),
    metaTitle: meta.metaTitle || '',
    metaDescription: meta.metaDescription || ''
  }};
}
function renderPageMetaField(f, value){
  if(f.type==='textarea') return `<textarea id="pm_${f.key}" rows="${f.rows||3}" placeholder="${escapeAttr(f.placeholder||'')}">${escapeHtml(value||'')}</textarea>`;
  return `<input type="text" id="pm_${f.key}" value="${escapeAttr(value||'')}" placeholder="${escapeAttr(f.placeholder||'')}">`;
}
function renderPageMetaCard(pageKey){
  ensurePageMetaEditBuffer(pageKey);
  const v = pageMetaEditBuffer.values;
  const isCustom = !!DB.customPages[pageKey];
  const fieldsHtml = PAGE_META_FIELDS.map(f=>
    `<div class="fld ${f.span2?'span2':''}"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label>${renderPageMetaField(f, v[f.key])}</div>`
  ).join('');
  return `<div class="card" style="margin-bottom:20px">
    <div class="card-head">
      <div>
        <h2>Thông tin trang</h2>
        <div class="desc">Tên, đường dẫn (slug) và metadata SEO của trang này</div>
      </div>
      ${isCustom ? `<button class="btn btn-danger-outline" id="pageDeleteBtn"><i class="ti ti-trash"></i> Xóa trang</button>` : ''}
    </div>
    <div class="sec-detail-group"><div class="form-grid">${fieldsHtml}</div></div>
    <div class="sec-detail-actions">
      <button class="btn btn-primary" id="pageMetaSaveBtn"><i class="ti ti-check"></i> Lưu thông tin trang</button>
    </div>
  </div>`;
}
function attachPageMetaCardEvents(pageKey){
  const saveBtn = document.getElementById('pageMetaSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const values = {};
    PAGE_META_FIELDS.forEach(f=>{ values[f.key] = document.getElementById('pm_'+f.key).value; });
    if(!values.title.trim()){ showToast('Vui lòng nhập tên trang', true); return; }
    if(!values.slug.trim()) values.slug = slugify(values.title);
    if(!values.slug.startsWith('/')) values.slug = '/'+values.slug;
    DB.pageMeta[pageKey] = values;
    if(DB.customPages[pageKey]) DB.customPages[pageKey].label = values.title;
    pageMetaEditBuffer = null;
    await saveDB();
    renderSidebar();
    renderContent();
    showToast('Đã lưu thông tin trang');
  });
  const delBtn = document.getElementById('pageDeleteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(!confirm(`Xóa trang "${getPageLabel(pageKey)}"? Toàn bộ section của trang này cũng sẽ bị xóa. Hành động này không thể hoàn tác.`)) return;
    delete DB.customPages[pageKey];
    delete DB.customSections[pageKey];
    delete DB.pageSections[pageKey];
    delete DB.pageMeta[pageKey];
    delete DB.pageSectionKeysEverAdded[pageKey];
    pageMetaEditBuffer = null;
    saveDB().then(()=>{ setView('pages'); showToast('Đã xóa trang'); });
  });
}

function attachPageSectionsEvents(){
  const pageKey = currentView.slice(5);
  const backBtn = document.querySelector('[data-back-to-pages]');
  if(backBtn) backBtn.addEventListener('click', ()=>{ pageMetaEditBuffer = null; setView('pages'); });
  attachPageMetaCardEvents(pageKey);
  document.querySelectorAll('[data-move-up]').forEach(el=>{
    el.addEventListener('click', ()=> moveSectionRow(parseInt(el.getAttribute('data-move-up'),10), -1));
  });
  document.querySelectorAll('[data-move-down]').forEach(el=>{
    el.addEventListener('click', ()=> moveSectionRow(parseInt(el.getAttribute('data-move-down'),10), 1));
  });
  document.querySelectorAll('[data-enable-input]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const s = DB.pageSections[pageKey].find(r=>r.key===el.getAttribute('data-enable-input'));
      s.enabled = !s.enabled;
      await saveDB();
      renderContent();
      showToast('Đã lưu cấu hình (giả lập)');
    });
  });
  document.querySelectorAll('[data-remove-section]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-remove-section');
      const def = getSectionDef(pageKey, key) || {};
      if(!confirm(`Xóa section "${getSectionLabel(pageKey, key)}" khỏi trang này?`)) return;
      DB.pageSections[pageKey] = DB.pageSections[pageKey].filter(s=>s.key!==key);
      if(def.custom){
        DB.customSections[pageKey] = (DB.customSections[pageKey]||[]).filter(s=>s.key!==key);
      }
      if(activeSectionKey===key){ activeSectionKey = null; sectionEditBuffer = null; }
      saveDB();
      renderContent();
      showToast('Đã xóa section khỏi trang');
    });
  });
  document.querySelectorAll('[data-rename-section]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-rename-section');
      const current = getSectionLabel(pageKey, key);
      const next = prompt('Tên section:', current);
      if(next===null) return;
      const trimmed = next.trim();
      if(!trimmed || trimmed===current) return;
      const entry = DB.pageSections[pageKey].find(s=>s.key===key);
      entry.labelOverride = trimmed;
      saveDB();
      renderContent();
      showToast('Đã đổi tên section');
    });
  });
  const addSectionBtn = document.querySelector('[data-add-section]');
  if(addSectionBtn) addSectionBtn.addEventListener('click', ()=> openAddSectionModal(pageKey));
  document.querySelectorAll('[data-select-section]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-move-up],[data-move-down],[data-enable-input],[data-remove-section],[data-rename-section]')) return;
      activeSectionKey = el.getAttribute('data-select-section');
      sectionEditBuffer = null;
      renderContent();
    });
  });
  attachSectionDetailEvents(pageKey, activeSectionKey);
}

async function moveSectionRow(idx, dir){
  const pageKey = currentView.slice(5);
  const list = DB.pageSections[pageKey];
  const j = idx + dir;
  if(j<0 || j>=list.length) return;
  [list[idx], list[j]] = [list[j], list[idx]];
  await saveDB();
  renderContent();
}


/* =========================================================
   SECTION DETAIL PANEL (mô phỏng)
   ========================================================= */
function ensureSectionEditBuffer(pageKey, key){
  if(sectionEditBuffer && sectionEditBuffer.pageKey===pageKey && sectionEditBuffer.key===key) return;
  const entry = DB.pageSections[pageKey].find(r=>r.key===key) || {};
  sectionEditBuffer = {
    pageKey, key,
    title: entry.title,
    itemCount: entry.itemCount,
    content: entry.content ? {...entry.content} : undefined,
    items: entry.items ? JSON.parse(JSON.stringify(entry.items)) : undefined,
    tournamentIds: entry.tournamentIds ? [...entry.tournamentIds] : undefined,
    newsIds: entry.newsIds ? [...entry.newsIds] : undefined,
    partnerIds: entry.partnerIds ? [...entry.partnerIds] : undefined,
    pickerMode: entry.pickerMode || 'manual',
    autoCount: entry.autoCount,
    backgroundImage: entry.backgroundImage || null
  };
}

function latestTournaments(n){ return [...DB.tournaments].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0, n); }
function latestNews(n){ return [...DB.news].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0, n); }

function renderSectionDetailPanel(pageKey, key){
  if(!key){
    return `<div class="empty" style="padding:60px 20px"><i class="ti ti-layout-2"></i><b>Trang này chưa có section</b></div>`;
  }
  const def = getSectionDef(pageKey, key);
  const entry = DB.pageSections[pageKey].find(r=>r.key===key);
  const buf = sectionEditBuffer;

  let html = `<div class="card-head">
      <div>
        <h2>${escapeHtml(getSectionLabel(pageKey, key))} <button class="btn-icon" data-rename-section-detail title="Đổi tên section" style="vertical-align:middle"><i class="ti ti-pencil" style="font-size:13px"></i></button> ${def.apiIntegrated?'<span class="badge" style="margin-left:4px"><i class="ti ti-api"></i> API</span>':''}</h2>
        <div class="desc">Cấu hình nội dung hiển thị cho section này</div>
      </div>
      <span class="sec-status-tag ${entry.enabled?'on':'off'}">${entry.enabled?'Đang hiển thị':'Đang ẩn'}</span>
    </div>`;

  html += `<div class="sec-detail-group">
    <div class="sec-detail-group-label">Hiển thị</div>`;
  if(def.title!==undefined){
    html += `<div class="fld" style="max-width:420px"><label>Tiêu đề hiển thị</label><input type="text" id="secTitleInput" value="${escapeAttr(buf.title ?? '')}" placeholder="${escapeAttr(def.title||'')}"></div>`;
  }
  if(def.items){
    html += `<div class="fld" style="max-width:160px;margin-top:${def.title!==undefined?'14px':'0'}"><label>Số lượng hiển thị</label><input type="number" min="1" max="${def.maxItems}" id="secCountInput" value="${buf.itemCount ?? def.itemCount}"></div>`;
  }
  if(def.title===undefined && !def.items){
    html += `<div class="hint">Section này không có tuỳ chọn hiển thị bổ sung.</div>`;
  }
  html += `</div>`;

  html += `<div class="sec-detail-group"><div class="sec-detail-group-label">Nội dung</div>`;
  if(def.tournamentSelect){
    html += renderPickerModeSection('tournament', def, buf);
  } else if(def.newsPicker){
    html += renderPickerModeSection('news', def, buf);
  } else if(def.partnerPicker){
    html += renderPartnerPickerInline(buf);
  } else if(def.fields){
    html += `<div class="form-grid">` + def.fields.map(f=>
      `<div class="fld ${f.span2?'span2':''}"><label>${f.label}</label>${f.type==='textarea' ? renderRichTextField(f, buf.content[f.key]) : renderField(f, buf.content[f.key])}</div>`
    ).join('') + `</div>`;
  } else if(def.itemFields){
    html += renderItemsEditorInline(def.itemFields, buf.items);
  } else {
    html += `<div class="hint">Section này không có nội dung tuỳ chỉnh (dùng chung bố cục cố định).</div>`;
  }
  html += `</div>`;

  html += `<div class="sec-detail-group"><div class="sec-detail-group-label">Ảnh nền</div>${renderBackgroundImageInline(buf)}</div>`;

  html += `<div class="sec-detail-actions">
    <button class="btn btn-ghost" id="secDiscardBtn">Hủy thay đổi</button>
    <button class="btn btn-primary" id="secSaveBtn"><i class="ti ti-check"></i> Lưu thay đổi</button>
  </div>`;

  return html;
}

function renderPickerInline(ids, allItems, renderMeta){
  const selected = ids.map(id=>allItems.find(x=>x.id===id)).filter(Boolean);
  const selectedHtml = selected.length ? selected.map((item, idx)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line)">
      <div class="sec-row-order">
        <button class="btn-icon" data-picker-up="${idx}" ${idx===0?'disabled style="opacity:.3"':''} title="Lên"><i class="ti ti-chevron-up"></i></button>
        <button class="btn-icon" data-picker-down="${idx}" ${idx===selected.length-1?'disabled style="opacity:.3"':''} title="Xuống"><i class="ti ti-chevron-down"></i></button>
      </div>
      <span class="cell-muted" style="font-size:11px;width:16px;text-align:center;flex-shrink:0">${idx+1}</span>
      ${renderMeta(item)}
      <button class="btn-icon" data-picker-remove="${item.id}" title="Bỏ chọn"><i class="ti ti-x"></i></button>
    </div>`).join('') : `<div class="empty" style="padding:16px"><b>Chưa chọn mục nào</b></div>`;

  const available = allItems.filter(x=>!ids.includes(x.id));
  const availableHtml = available.map(item=>`
    <label style="display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer" data-picker-add-row="${item.id}">
      <i class="ti ti-plus" style="color:var(--hint);font-size:14px;flex-shrink:0"></i>
      ${renderMeta(item)}
    </label>`).join('');

  return `<div class="sec-detail-group-label" style="margin-bottom:8px">Đã chọn (${selected.length}) — dùng mũi tên để sắp xếp thứ tự hiển thị</div>
    <div style="border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;margin-bottom:16px">${selectedHtml}</div>
    <div class="sec-detail-group-label" style="margin-bottom:8px">Thêm mục</div>
    <div style="max-height:220px;overflow-y:auto;border:1px solid var(--line-strong);border-radius:8px">${availableHtml || '<div class="empty" style="padding:16px"><b>Không còn mục nào khác</b></div>'}</div>`;
}

function renderPickerModeSection(kind, def, buf){
  const multi = kind==='tournament' ? !def.singleSelect : true;
  const mode = buf.pickerMode || 'manual';
  const noun = kind==='tournament' ? 'giải đấu' : 'tin tức';

  let html = `<div style="display:flex;gap:8px;margin-bottom:16px">
    <button type="button" class="btn ${mode==='auto'?'btn-primary':'btn-ghost'}" data-picker-mode-btn="auto"><i class="ti ti-bolt"></i> Tự động (mới nhất)</button>
    <button type="button" class="btn ${mode==='manual'?'btn-primary':'btn-ghost'}" data-picker-mode-btn="manual"><i class="ti ti-list"></i> Chọn thủ công</button>
  </div>`;

  if(mode==='auto'){
    if(multi){
      const count = buf.autoCount || 3;
      const latest = kind==='tournament' ? latestTournaments(count) : latestNews(count);
      const previewRows = latest.map(x=>`<div style="padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px">${escapeHtml(kind==='tournament'?x.name:x.title)}</div>`).join('') || `<div class="empty" style="padding:16px"><b>Chưa có dữ liệu</b></div>`;
      html += `<div class="fld" style="max-width:160px;margin-bottom:14px"><label>Số lượng hiển thị</label><input type="number" min="1" id="secAutoCountInput" value="${count}"></div>
        <div class="hint" style="margin-bottom:8px">Hệ thống sẽ tự động lấy ${count} ${noun} mới nhất theo ngày, không cần chọn thủ công (mô phỏng, chưa áp dụng trực tiếp). Xem trước:</div>
        <div style="border:1px solid var(--line-strong);border-radius:8px;overflow:hidden">${previewRows}</div>`;
    } else {
      const latest = latestTournaments(1)[0];
      html += `<div class="hint" style="margin-bottom:8px">Hệ thống sẽ tự động lấy giải đấu mới nhất theo ngày, không cần chọn thủ công (mô phỏng, chưa áp dụng trực tiếp).</div>
        <div style="border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:13.5px">${latest ? escapeHtml(latest.name) : '<span class="hint">Chưa có giải đấu nào</span>'}</div>`;
    }
    return html;
  }

  html += kind==='tournament' ? renderTournamentPickerInline(def, buf) : renderNewsPickerInline(buf);
  return html;
}

function renderTournamentPickerInline(def, buf){
  const statusMap = COLLECTIONS.tournaments.columns.find(c=>c.status)?.statusMap || {};
  const renderMeta = t=>{
    const m = statusMap[t.status];
    return `<span style="flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(t.name||'(chưa có tên)')}</span><span class="badge">${escapeHtml(t.category||'')}</span>${m ? `<span class="status ${m.c}">${m.t}</span>` : ''}`;
  };

  if(def.singleSelect){
    const ids = buf.tournamentIds || [];
    const rows = DB.tournaments.map(t=>`<label style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer">
        <input type="radio" name="secTournamentPick" data-sec-tournament-pick="${t.id}" ${ids.includes(t.id)?'checked':''} style="width:16px;height:16px;flex-shrink:0">
        ${renderMeta(t)}
      </label>`).join('');
    const hint = def.apiIntegrated ? 'Dữ liệu sẽ được lấy tự động qua API theo giải đấu đã chọn (mô phỏng, chưa gọi API thật).' : 'Nội dung sẽ lấy tự động từ giải đấu đã chọn trong danh mục "Giải đấu".';
    return `<div style="max-height:320px;overflow-y:auto;border:1px solid var(--line-strong);border-radius:8px">${rows || '<div class="empty" style="padding:20px"><b>Chưa có giải đấu nào</b></div>'}</div>
      <div class="hint" style="margin-top:10px">${hint}</div>`;
  }

  const hint = def.apiIntegrated
    ? 'Bảng xếp hạng sẽ được lấy tự động qua API theo các giải đấu đã chọn, đúng theo thứ tự bên trên (mô phỏng, chưa gọi API thật).'
    : 'Nội dung hiển thị sẽ lấy tự động từ các giải đấu đã chọn, đúng theo thứ tự bên trên.';
  return renderPickerInline(buf.tournamentIds || [], DB.tournaments, renderMeta) + `<div class="hint" style="margin-top:10px">${hint}</div>`;
}

function renderNewsPickerInline(buf){
  const renderMeta = n=>`<span style="flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(n.title||'(chưa có tiêu đề)')}</span><span class="badge">${escapeHtml(n.category||'')}</span><span class="cell-muted" style="font-size:11px;width:76px;text-align:right;flex-shrink:0">${fmtDate(n.date)}</span>`;
  return renderPickerInline(buf.newsIds || [], DB.news, renderMeta) + `<div class="hint" style="margin-top:10px">Thứ tự hiển thị theo danh sách "Đã chọn" bên trên.</div>`;
}

function renderPartnerPickerInline(buf){
  const renderMeta = p=>{
    const thumb = p.image ? `<img src="${p.image}" style="width:28px;height:28px;border-radius:6px;object-fit:cover;flex-shrink:0">` : `<div style="width:28px;height:28px;border-radius:6px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--hint);flex-shrink:0"><i class="ti ti-building" style="font-size:14px"></i></div>`;
    return `${thumb}<span style="flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.name||'(chưa có tên)')}</span><span class="badge">${escapeHtml(p.tier||'')}</span>`;
  };
  return renderPickerInline(buf.partnerIds || [], DB.partners, renderMeta) + `<div class="hint" style="margin-top:10px">Nội dung hiển thị sẽ lấy tự động từ các đối tác/nhà tài trợ đã chọn trong danh mục "Đối tác & Tài trợ", đúng theo thứ tự bên trên.</div>`;
}

function renderItemsEditorInline(itemFields, items){
  const imageField = itemFields.find(f=>f.type==='image');
  const textFields = itemFields.filter(f=>f.type!=='image');

  const rows = items.map((item, idx)=>{
    const imageHtml = imageField ? `<div style="width:88px;flex-shrink:0">
      ${item[imageField.key] ? `<img src="${item[imageField.key]}" style="width:100%;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:6px">` : `<div style="width:100%;height:88px;border:1px dashed var(--line-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--hint);margin-bottom:6px"><i class="ti ti-photo" style="font-size:20px"></i></div>`}
      <input type="file" accept="image/*" data-sec-ci-image="${idx}:${imageField.key}" style="font-size:10px;width:100%">
    </div>` : '';

    const fieldsHtml = textFields.map(f=>
      `<div class="fld" style="margin:0"><label style="font-size:11px">${f.label}</label><input type="text" data-sec-ci="${idx}:${f.key}" value="${escapeAttr(item[f.key]||'')}"></div>`
    ).join('');

    return `<div style="display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line-strong);border-radius:10px;margin-bottom:10px" data-sec-ci-row="${idx}">
      ${imageHtml}
      <div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 14px">${fieldsHtml}</div>
      <button class="btn-icon" data-sec-ci-remove="${idx}" title="Xóa mục" style="flex-shrink:0"><i class="ti ti-trash"></i></button>
    </div>`;
  }).join('');
  return `<div id="secCiList">${rows || '<div class="empty" style="padding:24px"><b>Chưa có mục nào</b></div>'}</div>
    <button class="btn btn-ghost" id="secCiAdd" style="margin-top:4px"><i class="ti ti-plus"></i> Thêm mục</button>`;
}

function renderBackgroundImageInline(buf){
  return `
    ${buf.backgroundImage ? `<div style="margin-bottom:12px"><img src="${buf.backgroundImage}" style="max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block"></div>` : ''}
    <input type="file" id="secBgFileInput" accept="image/*">
    <div class="hint" style="margin-top:10px;display:flex;gap:6px"><i class="ti ti-info-circle"></i> Ảnh được lưu trực tiếp trong CMS (mô phỏng) — nên dùng ảnh dung lượng nhỏ.</div>
    ${buf.backgroundImage ? `<button class="btn btn-danger-outline" id="secBgRemoveBtn" style="margin-top:12px"><i class="ti ti-trash"></i> Xóa ảnh nền</button>` : ''}
  `;
}

function syncSectionItemsFromInputs(){
  if(!sectionEditBuffer.items) return;
  document.querySelectorAll('[data-sec-ci]').forEach(el=>{
    const [idx, key] = el.getAttribute('data-sec-ci').split(':');
    sectionEditBuffer.items[parseInt(idx,10)][key] = el.value;
  });
}

function attachSectionDetailEvents(pageKey, key){
  if(!key) return;
  const def = getSectionDef(pageKey, key);
  const buf = sectionEditBuffer;
  attachRTEEvents();

  const renameBtn = document.querySelector('[data-rename-section-detail]');
  if(renameBtn) renameBtn.addEventListener('click', ()=>{
    const current = getSectionLabel(pageKey, key);
    const next = prompt('Tên section:', current);
    if(next===null) return;
    const trimmed = next.trim();
    if(!trimmed || trimmed===current) return;
    const entry = DB.pageSections[pageKey].find(s=>s.key===key);
    entry.labelOverride = trimmed;
    saveDB();
    renderContent();
    showToast('Đã đổi tên section');
  });

  document.querySelectorAll('[data-picker-mode-btn]').forEach(el=>{
    el.addEventListener('click', ()=>{
      buf.pickerMode = el.getAttribute('data-picker-mode-btn');
      renderContent();
    });
  });

  document.querySelectorAll('[data-sec-tournament-pick]').forEach(cb=>{
    cb.addEventListener('change', ()=>{ buf.tournamentIds = cb.checked ? [cb.getAttribute('data-sec-tournament-pick')] : []; });
  });

  const pickerField = (def.tournamentSelect && !def.singleSelect) ? 'tournamentIds' : (def.newsPicker ? 'newsIds' : (def.partnerPicker ? 'partnerIds' : null));
  if(pickerField){
    document.querySelectorAll('[data-picker-add-row]').forEach(el=>{
      el.addEventListener('click', ()=>{
        buf[pickerField].push(el.getAttribute('data-picker-add-row'));
        renderContent();
      });
    });
    document.querySelectorAll('[data-picker-remove]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-picker-remove');
        buf[pickerField] = buf[pickerField].filter(x=>x!==id);
        renderContent();
      });
    });
    document.querySelectorAll('[data-picker-up]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = parseInt(el.getAttribute('data-picker-up'),10);
        if(idx<=0) return;
        const arr = buf[pickerField];
        [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
        renderContent();
      });
    });
    document.querySelectorAll('[data-picker-down]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = parseInt(el.getAttribute('data-picker-down'),10);
        const arr = buf[pickerField];
        if(idx>=arr.length-1) return;
        [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
        renderContent();
      });
    });
  }

  const addBtn = document.getElementById('secCiAdd');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    syncSectionItemsFromInputs();
    const blank = {}; def.itemFields.forEach(f=>blank[f.key]='');
    buf.items.push(blank);
    renderContent();
  });
  document.querySelectorAll('[data-sec-ci-remove]').forEach(el=>{
    el.addEventListener('click', ()=>{
      syncSectionItemsFromInputs();
      buf.items.splice(parseInt(el.getAttribute('data-sec-ci-remove'),10), 1);
      renderContent();
    });
  });
  document.querySelectorAll('[data-sec-ci-image]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      syncSectionItemsFromInputs();
      const [idx, fkey] = el.getAttribute('data-sec-ci-image').split(':');
      const reader = new FileReader();
      reader.onload = (ev)=>{ buf.items[parseInt(idx,10)][fkey] = ev.target.result; renderContent(); };
      reader.readAsDataURL(file);
    });
  });

  const bgInput = document.getElementById('secBgFileInput');
  if(bgInput) bgInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ buf.backgroundImage = ev.target.result; renderContent(); };
    reader.readAsDataURL(file);
  });
  const bgRemoveBtn = document.getElementById('secBgRemoveBtn');
  if(bgRemoveBtn) bgRemoveBtn.addEventListener('click', ()=>{ buf.backgroundImage = null; renderContent(); });

  const saveBtn = document.getElementById('secSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=> saveSectionDetail(pageKey, key));
  const discardBtn = document.getElementById('secDiscardBtn');
  if(discardBtn) discardBtn.addEventListener('click', ()=>{ sectionEditBuffer = null; renderContent(); showToast('Đã hủy thay đổi'); });
}

async function saveSectionDetail(pageKey, key){
  const def = getSectionDef(pageKey, key);
  const buf = sectionEditBuffer;

  const titleInput = document.getElementById('secTitleInput');
  if(titleInput) buf.title = titleInput.value;
  const countInput = document.getElementById('secCountInput');
  if(countInput) buf.itemCount = Math.max(1, parseInt(countInput.value,10)||1);
  const autoCountInput = document.getElementById('secAutoCountInput');
  if(autoCountInput) buf.autoCount = Math.max(1, parseInt(autoCountInput.value,10)||1);
  if(def.fields){
    buf.content = buf.content || {};
    def.fields.forEach(f=>{
      buf.content[f.key] = f.type==='textarea' ? document.getElementById('rte_'+f.key).innerHTML : document.getElementById('f_'+f.key).value;
    });
  }
  if(def.itemFields) syncSectionItemsFromInputs();

  const entry = DB.pageSections[pageKey].find(r=>r.key===key);
  if(def.title!==undefined) entry.title = buf.title;
  if(def.items) entry.itemCount = buf.itemCount;
  if(def.fields) entry.content = buf.content;
  if(def.itemFields){ entry.items = buf.items; entry.itemCount = buf.items.length; }
  if(def.tournamentSelect) entry.tournamentIds = buf.tournamentIds;
  if(def.newsPicker) entry.newsIds = buf.newsIds;
  if(def.partnerPicker) entry.partnerIds = buf.partnerIds;
  if(def.tournamentSelect || def.newsPicker){
    entry.pickerMode = buf.pickerMode;
    if(!def.singleSelect) entry.autoCount = buf.autoCount;
  }
  entry.backgroundImage = buf.backgroundImage;

  await saveDB();
  sectionEditBuffer = null;
  renderContent();
  showToast('Đã lưu section (giả lập)');
}

const RTE_TOOLBAR = [
  {cmd:'bold', icon:'ti-bold', title:'Đậm'},
  {cmd:'italic', icon:'ti-italic', title:'Nghiêng'},
  {cmd:'underline', icon:'ti-underline', title:'Gạch chân'},

  {cmd:'formatBlock:h3', icon:'ti-h-3', title:'Tiêu đề nhỏ'},
  {cmd:'insertUnorderedList', icon:'ti-list', title:'Danh sách chấm'},
  {cmd:'insertOrderedList', icon:'ti-list-numbers', title:'Danh sách số'},
  {cmd:'sep'},
  {cmd:'createLink', icon:'ti-link', title:'Chèn liên kết'},
  {cmd:'removeFormat', icon:'ti-clear-formatting', title:'Xóa định dạng'}
];
function renderRichTextField(f, value){
  const toolbar = RTE_TOOLBAR.map(t=> t.cmd==='sep' ? `<span class="sep"></span>` : `<button type="button" data-cmd="${t.cmd}" title="${t.title}"><i class="ti ${t.icon}"></i></button>`).join('');
  return `<div class="rte" data-rte-field="${f.key}">
    <div class="rte-toolbar">${toolbar}</div>
    <div class="rte-body" id="rte_${f.key}" contenteditable="true" data-placeholder="${escapeAttr(f.placeholder||'Nhập nội dung...')}">${value||''}</div>
  </div>`;
}
function attachRTEEvents(){
  document.querySelectorAll('.rte').forEach(wrap=>{
    const editor = wrap.querySelector('.rte-body');
    wrap.querySelectorAll('[data-cmd]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.preventDefault();
        editor.focus();
        const cmd = btn.getAttribute('data-cmd');
        if(cmd==='createLink'){
          const url = prompt('Nhập URL liên kết:');
          if(url) document.execCommand('createLink', false, url);
        } else if(cmd.startsWith('formatBlock:')){
          document.execCommand('formatBlock', false, cmd.split(':')[1]);
        } else {
          document.execCommand(cmd, false, null);
        }
      });
    });
  });
}

function renderField(f, value){
  value = value===undefined||value===null ? '' : value;
  const disabledAttr = f.disabled ? 'disabled' : '';
  const disabledHint = f.disabled ? `<div class="fld-hint"><i class="ti ti-lock"></i> Do hệ thống quản lý, không thể chỉnh sửa</div>` : '';
  if(f.type==='select'){
    const opts = f.options.map(o=>{
      const lbl = f.optionLabels ? (f.optionLabels[o]||o) : o;
      return `<option value="${escapeAttr(o)}" ${value===o?'selected':''}>${escapeHtml(lbl)}</option>`;
    }).join('');
    return `<select id="f_${f.key}" ${disabledAttr}><option value="">— Chọn —</option>${opts}</select>${disabledHint}`;
  }
  if(f.type==='multiselect'){
    const values = Array.isArray(value) ? value : (value ? [value] : []);
    const chips = f.options.map(o=>{
      const lbl = f.optionLabels ? (f.optionLabels[o]||o) : o;
      const on = values.includes(o);
      return `<div class="chip ${on?'on':''}" data-multiselect="${f.key}" data-value="${escapeAttr(o)}">${escapeHtml(lbl)}</div>`;
    }).join('');
    return `<div class="chiplist" id="f_${f.key}">${chips}</div>`;
  }
  if(f.type==='textarea'){
    return `<textarea id="f_${f.key}" rows="${f.rows||3}" placeholder="${escapeAttr(f.placeholder||'')}" ${disabledAttr}>${escapeHtml(value)}</textarea>${disabledHint}`;
  }
  if(f.type==='checkbox'){
    return `<div class="checkbox-row"><span class="switch ${value?'on':''}" id="f_${f.key}" data-toggle></span><label>Bật</label></div>`;
  }
  if(f.type==='number'){
    return `<input type="number" id="f_${f.key}" value="${escapeAttr(value)}" placeholder="${escapeAttr(f.placeholder||'')}" ${disabledAttr}>${disabledHint}`;
  }
  if(f.type==='date'){
    return `<input type="date" id="f_${f.key}" value="${escapeAttr(value)}" ${disabledAttr}>${disabledHint}`;
  }
  if(f.type==='password'){
    return `<input type="password" id="f_${f.key}" value="${escapeAttr(value)}" placeholder="${escapeAttr(f.placeholder||'')}" autocomplete="new-password" ${disabledAttr}>${disabledHint}`;
  }
  if(f.type==='image'){
    return `<div>
      <div id="imgPreview_${f.key}" style="margin-bottom:8px">${value ? `<img src="${value}" style="width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block">` : `<div style="width:96px;height:96px;border:1px dashed var(--line-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--hint)"><i class="ti ti-photo" style="font-size:22px"></i></div>`}</div>
      <input type="file" accept="image/*" data-image-field="${f.key}">
    </div>`;
  }
  return `<input type="text" id="f_${f.key}" value="${escapeAttr(value)}" placeholder="${escapeAttr(f.placeholder||'')}" ${disabledAttr}>${disabledHint}`;
}

  const key = editingCollection;
  const c = COLLECTIONS[key];
  const data = {};
  let missingRequired = false;
  c.fields.forEach(f=>{
    let val;
    if(f.type==='checkbox'){ val = document.getElementById('f_'+f.key).classList.contains('on'); }
    else if(f.type==='image'){ val = modalImageValues[f.key] || ''; }
    else if(f.type==='richtext'){ val = document.getElementById('rte_'+f.key).innerHTML; }
    else if(f.type==='multiselect'){
      val = Array.from(document.querySelectorAll(`[data-multiselect="${f.key}"].on`)).map(el=>el.getAttribute('data-value'));
    }
    else {
      val = document.getElementById('f_'+f.key).value;
      if(f.type==='number' && val!=='') val = Number(val);
    }
    if(f.type==='password' && val==='' && editingId) return;
    if(f.required && (val===''||val===undefined||val===null)) missingRequired = true;
    data[f.key] = val;
  });
  if(missingRequired){ showToast('Vui lòng điền đầy đủ các trường bắt buộc (*)', true); return; }

  if(c.remote){
    const ok = c.strapiUsers ? await saveRemoteAccount(editingId, data) : await saveRemoteCollectionRecord(key, editingId, data);
    if(!ok) return;
    closeModal();
    renderSidebar();
    renderContent();
    showToast(editingId ? 'Đã cập nhật' : 'Đã thêm mới');
    return;
  }

  if(editingId){
    const idx = DB[key].findIndex(r=>r.id===editingId);
    DB[key][idx] = {...DB[key][idx], ...data};
  } else {
    data.id = uid();
    DB[key].push(data);
  }
  await saveDB();
  closeModal();
  renderSidebar();
  renderContent();
  showToast(editingId ? 'Đã cập nhật' : 'Đã thêm mới');
}

async function deleteModal(){
  if(!editingCollection || !editingId) return;
  const c = COLLECTIONS[editingCollection];
  if(c.remote){
    const ok = c.strapiUsers ? await deleteRemoteAccount(editingId) : await deleteRemoteCollectionRecord(editingCollection, editingId);
    if(!ok) return;
  } else {
    DB[editingCollection] = DB[editingCollection].filter(r=>r.id!==editingId);
    await saveDB();
  }
  closeModal();
  renderSidebar();
  renderContent();
  showToast('Đã xóa');
}

async function confirmDelete(key, id){
  const c = COLLECTIONS[key];
  const record = DB[key].find(r=>r.id===id);
  const label = record ? (record.name||record.title||record.displayName||'mục này') : 'mục này';
  if(!confirm(`Xóa "${label}" khỏi ${c.label}? Hành động này không thể hoàn tác.`)) return;
  if(c.remote){
    const ok = c.strapiUsers ? await deleteRemoteAccount(id) : await deleteRemoteCollectionRecord(key, id);
    if(!ok) return;
  } else {
    DB[key] = DB[key].filter(r=>r.id!==id);
    await saveDB();
  }
  renderSidebar();
  renderContent();
  showToast('Đã xóa');
}

let reTab = 'info';
let reHistFilter = '';

function renderRecordEditor(key, id){
  const c = COLLECTIONS[key];

  const record = isNew ? {} : (DB[key].find(r=>r.id===id) || {});
  const hasHistory = key==='members' && !isNew;

  const tabsHtml = hasHistory ? `<div style="display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px">

  const body = reTab==='history' ? renderMemberHistoryTab(record) : renderRecordInfoTab(key, record, isNew);
  return hasHistory ? `<div class="news-editor">${tabsHtml}${body}</div>` : body;

function reAddDiscipline(record){

function reUpdateDisciplinePoints(record, idx, value){

  d.points = Number(value)||0;
  recomputeMemberRanking();
  saveDB();
  renderSidebar();
  renderContent();
}
function reUpdateDisciplineMatches(record, idx, value){
  const d = record.disciplines && record.disciplines[idx]; if(!d) return;
  d.matches = Math.max(0, Number(value)||0);
  saveDB();
}
function reRemoveDiscipline(record, idx){
  const d = record.disciplines && record.disciplines[idx]; if(!d) return;

}

/* ---------- Lịch sử thi đấu (giải đấu + đấu tự do) ---------- */
function reMemberMatchHistory(memberId){
  const rows = [];
  DB.tournaments.forEach(t=>{
    if(t.mode==='sim') return;
    const players = t.players||[];
    const me = players.find(p=>p.memberId===memberId);
    if(!me) return;
    const nameOf = pid=>{ if(pid==='BYE') return 'BYE'; const p=players.find(x=>x.id===pid); return p?p.name:'—'; };
    if(t.bracket){
      Object.values(t.bracket.matches).forEach(m=>{
        if(m.status!=='done' || m.p1==null || m.p2==null || m.p1==='BYE' || m.p2==='BYE') return;
        if(m.p1!==me.id && m.p2!==me.id) return;
        const isP1 = m.p1===me.id;
        const won = m.win===me.id;
        rows.push({category:t.category, event:t.name, opponent:nameOf(isP1?m.p2:m.p1), score:`${isP1?m.s1:m.s2}–${isP1?m.s2:m.s1}`, points:won?(m.winPoints||0):(m.lossPoints||0), won, ts:m.decidedAt||null, free:false});
      });
    }
    if(t.rr){
      Object.values(t.rr.matches).forEach(m=>{
        if(m.win==null || (m.a!==me.id && m.b!==me.id)) return;
        const isA = m.a===me.id;
        const won = m.win===me.id;
        rows.push({category:t.category, event:t.name, opponent:nameOf(isA?m.b:m.a), score:`${isA?m.s1:m.s2}–${isA?m.s2:m.s1}`, points:won?(m.winPoints!=null?m.winPoints:TE_WIN_POINTS):(m.lossPoints!=null?m.lossPoints:TE_LOSS_POINTS), won, ts:m.decidedAt||null, free:false});
      });
    }
    if(t.sw){
      t.sw.matches.filter(m=>m.confirmed && !m.bye && (m.aId===me.id || m.bId===me.id)).forEach(m=>{
        const isA = m.aId===me.id;
        const won = m.winnerId===me.id;
        rows.push({category:t.category, event:t.name, opponent:nameOf(isA?m.bId:m.aId), score:`${isA?m.sa:m.sb}–${isA?m.sb:m.sa}`, points:won?(m.winPoints!=null?m.winPoints:TE_WIN_POINTS):(m.lossPoints!=null?m.lossPoints:TE_LOSS_POINTS), won, ts:m.ts||null, free:false});
      });
    }
  });
  const member = DB.members.find(x=>x.id===memberId);
  (member && member.freeMatches || []).forEach(fm=>{
    rows.push({category:fm.category, event:'Đấu tự do', opponent:fm.opponent, score:`${fm.score1}–${fm.score2}`, points:fm.points, won:fm.score1>fm.score2, ts:fm.ts, free:true, id:fm.id});
  });
  rows.sort((a,b)=>(b.ts||0)-(a.ts||0));
  return rows;
}
function reFmtHistTime(ts){
  if(!ts) return '—';
  const d = new Date(ts), p = x=>String(x).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderMemberHistoryTab(record){
  const allRows = reMemberMatchHistory(record.id);
  const catOptions = COLLECTIONS.members.fields.find(f=>f.key==='category').options;
  const histCats = [...new Set(allRows.map(r=>r.category).filter(Boolean))];
  if(reHistFilter && !histCats.includes(reHistFilter)) reHistFilter = '';
  const filterBar = histCats.length>1 ? `<div class="tbk-rrtab" style="border-bottom:none;padding:0 0 14px">
    <button class="${reHistFilter===''?'on':''}" data-re-hist-filter="">Tất cả</button>
    ${histCats.map(c=>`<button class="${reHistFilter===c?'on':''}" data-re-hist-filter="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join('')}
  </div>` : '';
  const rows = reHistFilter ? allRows.filter(r=>r.category===reHistFilter) : allRows;
  const rowsHtml = rows.map(r=>`<tr>
    <td>${escapeHtml(r.category||'—')}</td>
    <td class="cell-muted">${escapeHtml(r.opponent||'—')}</td>
    <td style="white-space:nowrap"><b style="color:${r.won?'var(--tag-green)':'var(--danger)'}">${escapeHtml(r.score)}</b></td>
    <td><b style="color:${r.points>=0?'var(--tag-green)':'var(--danger)'}">${r.points>=0?'+':''}${r.points}</b></td>
    <td class="cell-muted">${reFmtHistTime(r.ts)}</td>
    <td>${r.free ? `<span class="badge">Đấu tự do</span>` : `<span class="status blue">${escapeHtml(r.event)}</span>`}</td>
    <td class="actions">${r.free ? `<button class="btn-icon" data-re-rm-free="${r.id}" title="Xóa"><i class="ti ti-x"></i></button>` : ''}</td>
  </tr>`).join('');

  return `<div class="card"><div class="card-head"><div><h2>Ghi nhận trận đấu tự do</h2><div class="desc">Trận không thuộc giải đấu nào — cộng/trừ điểm xếp hạng trực tiếp</div></div></div>
    <div class="card-body padded">
      <div class="form-grid">
        <div class="fld"><label>Nội dung thi đấu</label><select id="re_fm_category"><option value="">— Chọn —</option>${catOptions.map(o=>`<option value="${escapeAttr(o)}">${escapeHtml(o)}</option>`).join('')}</select></div>
        <div class="fld"><label>Đối thủ</label><input type="text" id="re_fm_opponent" placeholder="Tên đối thủ"></div>
        <div class="fld"><label>Tỷ số của tôi</label><input type="number" min="0" id="re_fm_score1"></div>
        <div class="fld"><label>Tỷ số đối thủ</label><input type="number" min="0" id="re_fm_score2"></div>
        <div class="fld"><label>Điểm hạng thay đổi</label><input type="number" id="re_fm_points" placeholder="VD: 10 hoặc -5"></div>
        <div class="fld"><label>Ngày thi đấu</label><input type="date" id="re_fm_date"></div>
      </div>
      <div class="form-actions" style="justify-content:flex-end;border-top:none;padding-top:10px;margin-top:10px">
        <button class="btn btn-primary" id="reAddFreeMatchBtn"><i class="ti ti-plus"></i> Thêm trận đấu tự do</button>
      </div>
    </div>
  </div>
  ${filterBar}
  <div class="tbl-wrap" style="margin-top:${histCats.length>1?0:16}px">
    ${rows.length===0 ? `<div class="empty"><i class="ti ti-history"></i><b>Chưa có lịch sử thi đấu</b>${allRows.length?'Không có trận nào ở bộ môn này.':'Hội viên chưa tham gia trận đấu nào trong giải hoặc đấu tự do.'}</div>` : `<table><thead><tr><th>Nội dung thi đấu</th><th>Đối thủ</th><th>Tỷ số</th><th>Điểm hạng thay đổi</th><th>Thời gian thi đấu</th><th>Sự kiện</th><th style="width:50px"></th></tr></thead><tbody>${rowsHtml}</tbody></table>`}
  </div>`;
}
function reAddFreeMatch(record){
  const category = document.getElementById('re_fm_category').value;
  const opponent = document.getElementById('re_fm_opponent').value.trim();
  const score1 = document.getElementById('re_fm_score1').value;
  const score2 = document.getElementById('re_fm_score2').value;
  const points = document.getElementById('re_fm_points').value;
  const date = document.getElementById('re_fm_date').value;
  if(!opponent || score1==='' || score2==='' || points===''){ showToast('Vui lòng nhập đầy đủ đối thủ, tỷ số và điểm thay đổi', true); return; }
  const s1 = Number(score1), s2 = Number(score2), pts = Number(points);
  if(!Number.isFinite(s1) || !Number.isFinite(s2) || s1===s2){ showToast('Tỷ số không hợp lệ — phải có người thắng', true); return; }
  if(!category){ showToast('Vui lòng chọn nội dung thi đấu', true); return; }
  record.freeMatches = [...(record.freeMatches||[]), {id:uid(), category, opponent, score1:s1, score2:s2, points:pts, date, ts:date?new Date(date).getTime():Date.now()}];
  applyDisciplinePoints(record, category, pts, 1);
  recomputeMemberRanking();
  saveDB();
  showToast('Đã ghi nhận trận đấu tự do và cập nhật điểm xếp hạng');
  renderContent();
}
function reRemoveFreeMatch(record, fmId){
  const fm = (record.freeMatches||[]).find(x=>x.id===fmId);
  if(!fm) return;
  if(!confirm('Xóa trận đấu tự do này? Điểm xếp hạng đã cộng sẽ được hoàn tác.')) return;
  applyDisciplinePoints(record, fm.category, -fm.points, -1);
  record.freeMatches = record.freeMatches.filter(x=>x.id!==fmId);
  recomputeMemberRanking();
  saveDB();
  showToast('Đã xóa trận đấu tự do');
  renderContent();
}

function attachRecordEditorEvents(key){
  document.querySelectorAll('[data-retab]').forEach(t=>{
    t.addEventListener('click', ()=>{ reTab = t.getAttribute('data-retab'); renderContent(); });
  });
  if(reTab==='history' && key==='members'){
    const id = currentView.slice((key+'-edit:').length);
    const record = DB.members.find(r=>r.id===id);
    if(!record) return;
    const addBtn = document.getElementById('reAddFreeMatchBtn');
    if(addBtn) addBtn.addEventListener('click', ()=>reAddFreeMatch(record));
    document.querySelectorAll('[data-re-rm-free]').forEach(btn=>{
      btn.addEventListener('click', ()=>reRemoveFreeMatch(record, btn.getAttribute('data-re-rm-free')));
    });
    document.querySelectorAll('[data-re-hist-filter]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ reHistFilter = btn.getAttribute('data-re-hist-filter'); renderContent(); });
    });
    return;
  }
  attachRTEEvents();
  attachModalImageEvents();
  document.querySelectorAll('[data-multiselect]').forEach(chip=>{
    chip.addEventListener('click', ()=> chip.classList.toggle('on'));
  });
  const cancelBtn = document.getElementById('reCancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>setView(key));
  const saveBtn = document.getElementById('reSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>saveRecordEditor(key));
  const delBtn = document.getElementById('reDeleteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>deleteRecordEditor(key));
  if(key==='members'){
    const id = currentView.slice((key+'-edit:').length);
    const record = DB.members.find(r=>r.id===id);
    if(record){
      const addDiscBtn = document.getElementById('reAddDisciplineBtn');
      if(addDiscBtn) addDiscBtn.addEventListener('click', ()=>reAddDiscipline(record));
      document.querySelectorAll('[data-re-disc-points]').forEach(input=>{
        input.addEventListener('change', ()=>reUpdateDisciplinePoints(record, Number(input.getAttribute('data-re-disc-points')), input.value));
      });
      document.querySelectorAll('[data-re-disc-matches]').forEach(input=>{
        input.addEventListener('change', ()=>reUpdateDisciplineMatches(record, Number(input.getAttribute('data-re-disc-matches')), input.value));
      });
      document.querySelectorAll('[data-re-rm-disc]').forEach(btn=>{
        btn.addEventListener('click', ()=>reRemoveDiscipline(record, Number(btn.getAttribute('data-re-rm-disc'))));
      });
    }
  }
}
async function saveRecordEditor(key){
  const c = COLLECTIONS[key];
  const id = currentView.slice((key+'-edit:').length);
  const isNew = id==='new';
  const data = {};
  let missingRequired = false;
  c.fields.forEach(f=>{
    let val;
    if(f.type==='checkbox'){ val = document.getElementById('f_'+f.key).classList.contains('on'); }
    else if(f.type==='image'){ val = modalImageValues[f.key] || ''; }
    else if(f.type==='richtext'){ val = document.getElementById('rte_'+f.key).innerHTML; }
    else if(f.type==='multiselect'){
      val = Array.from(document.querySelectorAll(`[data-multiselect="${f.key}"].on`)).map(el=>el.getAttribute('data-value'));
    }
    else {
      val = document.getElementById('f_'+f.key).value;
      if(f.type==='number' && val!=='') val = Number(val);
    }
    if(f.required && (val===''||val===undefined||val===null)) missingRequired = true;
    data[f.key] = val;
  });
  if(missingRequired){ showToast('Vui lòng điền đầy đủ các trường bắt buộc (*)', true); return; }

  if(isNew){
    data.id = uid();
    DB[key].push(data);
  } else {
    const idx = DB[key].findIndex(r=>r.id===id);
    DB[key][idx] = {...DB[key][idx], ...data};
  }
  await saveDB();
  renderSidebar();
  showToast(isNew ? 'Đã thêm mới' : 'Đã lưu thay đổi');
  setView(key);
}
function deleteRecordEditor(key){
  const id = currentView.slice((key+'-edit:').length);
  const c = COLLECTIONS[key];
  const record = DB[key].find(r=>r.id===id);
  const label = record ? (record.name||record.title||`${c.single} này`) : `${c.single} này`;

/* =========================================================
   TOURNAMENT ENGINE (pure, no DOM)
   4 thể thức: Đấu loại trực tiếp (SE) · Đấu loại trực tiếp kép (DE) ·
   Vòng tròn (RR) · Swiss tính mạng (SW).
   Thuật toán port từ Biadi Tournament Manager (đã kiểm chứng) —
   xem Biadi_Tournament_Manager_SPEC.md.
   ========================================================= */
function tbkNextPow2(n){ let s=1; while(s<n) s*=2; return s; }
function tbkBracketSeeds(size){
  let s=[1,2];
  while(s.length<size){ const n=s.length*2, nx=[]; for(const x of s){ nx.push(x); nx.push(n+1-x); } s=nx; }
  return s;
}
function tbkPlace(M,tid,slot,pid){
  const m=M[tid]; if(slot===1) m.p1=pid; else m.p2=pid;
  if(m.p1!=null && m.p2!=null) m.status='ready';
}
function tbkDecide(M,mid,winId,s1,s2){
  const m=M[mid]; m.win=winId;
  if(s1!=null){ m.s1=s1; m.s2=s2; }
  m.status='done';
  const lose=(m.p1===winId?m.p2:m.p1);
  if(m.winTo) tbkPlace(M,m.winTo[0],m.winTo[1],winId);
  if(m.loseTo) tbkPlace(M,m.loseTo[0],m.loseTo[1],lose);
  return lose;
}
function tbkResolveByes(M){
  let chg=true;
  while(chg){ chg=false;
    for(const id in M){ const m=M[id];
      if(m.status==='ready' && (m.p1==='BYE'||m.p2==='BYE')){
        const w=(m.p1==='BYE'&&m.p2==='BYE')?'BYE':(m.p1==='BYE'?m.p2:m.p1);
        tbkDecide(M,m.id,w); chg=true;
      }
    }
  }
}
function tbkGenSE(seedIds){
  const N=seedIds.length, size=tbkNextPow2(N), seeds=tbkBracketSeeds(size), k=Math.log2(size);
  const M={}, rounds=[]; let id=0; const pid=s=>(s<=N?seedIds[s-1]:'BYE');
  let r0=[];
  for(let i=0;i<size/2;i++){ M[id]={id,br:'W',round:0,idx:i,p1:pid(seeds[2*i]),p2:pid(seeds[2*i+1]),win:null,s1:null,s2:null,status:'ready',winTo:null,loseTo:null}; r0.push(id); id++; }
  rounds.push(r0);
  for(let r=1;r<k;r++){ const cur=[], cnt=size/2**(r+1);
    for(let i=0;i<cnt;i++){ M[id]={id,br:'W',round:r,idx:i,p1:null,p2:null,win:null,s1:null,s2:null,status:'wait',winTo:null,loseTo:null}; cur.push(id); id++; }
    rounds[r-1].forEach((mid,i)=>M[mid].winTo=[cur[Math.floor(i/2)],(i%2)+1]); rounds.push(cur);
  }
  tbkResolveByes(M);
  return {matches:M, rounds, type:'SE', size, k};
}
function tbkGenDE(seedIds){
  const N=seedIds.length, size=tbkNextPow2(N), seeds=tbkBracketSeeds(size), k=Math.log2(size);
  const M={}; let id=0; const pid=s=>(s<=N?seedIds[s-1]:'BYE'); const WB=[], LB=[];
  let r0=[];
  for(let i=0;i<size/2;i++){ M[id]={id,br:'W',round:0,idx:i,p1:pid(seeds[2*i]),p2:pid(seeds[2*i+1]),win:null,s1:null,s2:null,status:'ready',winTo:null,loseTo:null}; r0.push(id); id++; }
  WB.push(r0);
  for(let r=1;r<k;r++){ const cur=[], cnt=size/2**(r+1);
    for(let i=0;i<cnt;i++){ M[id]={id,br:'W',round:r,idx:i,p1:null,p2:null,win:null,s1:null,s2:null,status:'wait',winTo:null,loseTo:null}; cur.push(id); id++; }
    WB[r-1].forEach((mid,i)=>M[mid].winTo=[cur[Math.floor(i/2)],(i%2)+1]); WB.push(cur);
  }
  let lbr=0;
  const mk=cnt=>{ const a=[]; for(let i=0;i<cnt;i++){ M[id]={id,br:'L',round:lbr,idx:i,p1:null,p2:null,win:null,s1:null,s2:null,status:'wait',winTo:null,loseTo:null}; a.push(id); id++; } LB.push(a); lbr++; return a; };
  let minor=mk(size/4);
  WB[0].forEach((mid,i)=>M[mid].loseTo=[minor[Math.floor(i/2)],(i%2)+1]);
  let prev=minor;
  for(let r=1;r<k;r++){ const major=mk(prev.length);
    prev.forEach((mid,i)=>M[mid].winTo=[major[i],1]); WB[r].forEach((mid,i)=>M[mid].loseTo=[major[i],2]); prev=major;
    if(r<k-1){ const mn=mk(prev.length/2); prev.forEach((mid,i)=>M[mid].winTo=[mn[Math.floor(i/2)],(i%2)+1]); prev=mn; }
  }
  const lbFinal=prev[0];
  M[id]={id,br:'GF',round:0,idx:0,p1:null,p2:null,win:null,s1:null,s2:null,status:'wait',winTo:null,loseTo:null}; const gfId=id; id++;
  M[id]={id,br:'GF2',round:0,idx:0,p1:null,p2:null,win:null,s1:null,s2:null,status:'void',winTo:null,loseTo:null}; const gf2Id=id; id++;
  M[WB[k-1][0]].winTo=[gfId,1]; M[lbFinal].winTo=[gfId,2]; M[gfId]._gf2=gf2Id;
  tbkResolveByes(M);
  return {matches:M, WB, LB, gfId, gf2Id, type:'DE', size, k};
}
function tbkGenRR(ids){
  let arr=ids.slice(); if(arr.length%2) arr.push('BYE');
  const n=arr.length, rounds=[]; let id=0; const M={};
  for(let r=0;r<n-1;r++){ const rd=[];
    for(let i=0;i<n/2;i++){ const a=arr[i], b=arr[n-1-i];
      if(a!=='BYE'&&b!=='BYE'){ M[id]={id,round:r,a,b,win:null,s1:null,s2:null}; rd.push(id); id++; }
    }
    rounds.push(rd); arr.splice(1,0,arr.pop());
  }
  return {matches:M, rounds, type:'RR'};
}
function tbkRoundName(r,total){
  const fromEnd=total-1-r;
  if(fromEnd===0) return 'Chung kết';
  if(fromEnd===1) return 'Bán kết';
  if(fromEnd===2) return 'Tứ kết';
  return 'Vòng '+(2**(total-r));
}
function tbkElimChampion(eng){
  if(eng.type==='SE'){ const last=eng.rounds[eng.rounds.length-1][0]; const m=eng.matches[last]; return m&&m.status==='done'?m.win:null; }
  const M=eng.matches, gf=M[eng.gfId], gf2=M[eng.gf2Id];
  if(gf2.status==='done') return gf2.win;
  if(gf.status==='done' && gf.win===gf.p1) return gf.win;
  return null;
}
function tbkShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---- Round Robin standings ---- */
function tbkRrStandings(rr, ids, nameOf){
  const st={}; ids.forEach(id=>st[id]={id,w:0,l:0,gd:0,pts:0,opp:{}});
  Object.values(rr.matches).forEach(m=>{ if(m.win==null) return; const lose=m.win===m.a?m.b:m.a;
    st[m.win].w++; st[lose].l++; st[m.win].pts++; st[m.a].gd+=(m.s1-m.s2); st[m.b].gd+=(m.s2-m.s1); st[m.win].opp[lose]=1; });
  return ids.map(id=>st[id]).sort((a,b)=>b.pts-a.pts || b.gd-a.gd || (b.opp[a.id]?1:-1));
}

/* ---- Swiss (lives) ---- */
function tbkSwDerive(playerIds, lives, matches){
  const st={}; playerIds.forEach(id=>st[id]={id,wins:0,losses:0,gw:0,gl:0,opps:new Set()});
  matches.filter(m=>m.confirmed).forEach(m=>{
    if(m.bye){ st[m.winnerId].wins++; return; }
    const w=m.winnerId, l=(m.aId===w?m.bId:m.aId);
    st[w].wins++; st[l].losses++;
    st[m.aId].gw+=m.sa; st[m.aId].gl+=m.sb; st[m.bId].gw+=m.sb; st[m.bId].gl+=m.sa;
    st[m.aId].opps.add(m.bId); st[m.bId].opps.add(m.aId);
  });
  playerIds.forEach(id=>{ const s=st[id]; s.alive=s.losses<lives; s.left=lives-s.losses; });
  return st;
}
function tbkSwSos(st,id){ let s=0; st[id].opps.forEach(o=>s+=st[o].wins); return s; }
function tbkSwRoundMatches(sw){ return sw.matches.filter(m=>m.round===sw.round); }
function tbkSwissDrawn(sw){ return tbkSwRoundMatches(sw).length>0; }
function tbkSwRoundComplete(sw){ const ms=tbkSwRoundMatches(sw); return ms.length>0 && ms.every(m=>m.confirmed); }
function tbkSwissDraw(sw, players, lives, nameOf){
  const ids=players.map(p=>p.id);
  const st=tbkSwDerive(ids, lives, sw.matches);
  const active=players.filter(p=>st[p.id].alive);
  const groups={}; for(let L=0;L<lives;L++) groups[L]=[];
  active.forEach(p=>groups[st[p.id].losses].push(p));
  const inner=g=>g.sort((a,b)=>st[b.id].wins-st[a.id].wins || tbkSwSos(st,b.id)-tbkSwSos(st,a.id) || nameOf(a.id).localeCompare(nameOf(b.id),'vi'));
  let pairs=[], fl=null;
  for(let L=0;L<lives;L++){ let g=inner(groups[L].slice()); if(sw.round===1) g=tbkShuffle(g); if(fl){ g=[fl,...g]; fl=null; }
    while(g.length>=2){ const a=g.shift(); let j=0; while(j<g.length && st[a.id].opps.has(g[j].id)) j++; if(j>=g.length) j=0; const b=g.splice(j,1)[0]; pairs.push([a,b]); }
    if(g.length) fl=g[0];
  }
  pairs.forEach(([a,b])=>sw.matches.push({id:sw.seq++, round:sw.round, aId:a.id, bId:b.id, winnerId:null, sa:null, sb:null, bye:false, confirmed:false, ts:null}));
  if(fl) sw.matches.push({id:sw.seq++, round:sw.round, aId:fl.id, bId:null, winnerId:fl.id, sa:null, sb:null, bye:true, confirmed:true, ts:Date.now()});
}
function tbkSwissNext(sw, players, lives){
  if(!tbkSwRoundComplete(sw)) return false;
  const st=tbkSwDerive(players.map(p=>p.id), lives, sw.matches);
  if(players.filter(p=>st[p.id].alive).length<=1) return false;
  sw.round++; return true;
}

/* ---- Simulator ---- */
function tbkWinProb(ra,rb){ return 1/(1+Math.exp(-(ra-rb)/180)); }
function tbkSimScore(aId,bId,ratingOf){
  const p=tbkWinProb(ratingOf(aId), ratingOf(bId));
  const win=Math.random()<p?aId:bId, lose=win===aId?bId:aId;
  const close=1-Math.abs(p-.5)*2;
  const ls=Math.min(4, Math.floor(Math.random()*5*(0.45+0.5*close)));
  return {win,lose,ws:5,ls};
}

  teEnsureDefaults(record);

  const tabs = [
    {key:'info', label:'Thông tin', icon:'ti-info-circle'},
    {key:'players', label:`Danh sách người chơi${record.players.length?` (${record.players.length})`:''}`, icon:'ti-users', disabled:isNew},

  ];

  </div>`;

  const hint = isNew ? `<div style="font-size:12px;color:var(--hint);margin-bottom:16px"><i class="ti ti-info-circle"></i> Lưu thông tin giải đấu trước để mở khóa danh sách người chơi và cặp đấu.</div>` : '';

  else if(teTab==='matches') body = renderTeMatchesTab(record);

  return `<div class="news-editor">${tabsHtml}${hint}${body}</div>`;

/* ---------- Cặp đấu & Kết quả — engine-driven (SE/DE/RR/Swiss) ---------- */
function teName(record, pid){
  if(pid==null) return '—';
  if(pid==='BYE') return '(Miễn đấu)';
  const p = record.players.find(x=>x.id===pid);
  return p ? p.name : '—';
}
function tePlayerRating(record, pid){
  if(pid==='BYE' || pid==null) return 1000;
  const p = record.players.find(x=>x.id===pid);
  if(!p) return 1000;
  if(p.rating) return p.rating;
  let r = 1000;
  if(p.memberId){
    const m = DB.members.find(x=>x.id===p.memberId);
    const d = m && (m.disciplines||[]).find(x=>x.category===record.category);
    if(d && d.points) r = 800 + Math.min(1400, d.points/2);
  } else r = 1000 + Math.round((Math.random()*2-1)*220);
  p.rating = r;
  return r;
}
function teFmtTime(ts){ const d = new Date(ts), p = x=>String(x).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
function teRecordFromView(){
  const id = currentView.slice('tournament-edit:'.length);
  return teRecord(id);
}
function applyDisciplinePoints(member, category, pointsDelta, matchesDelta){
  if(!member || !category) return;
  if(!member.disciplines) member.disciplines = [];
  let d = member.disciplines.find(x=>x.category===category);
  if(!d){ d = {category, points:0, rank:null, matches:0, trend:'eq', trendValue:0}; member.disciplines.push(d); }
  d.points = (d.points||0) + pointsDelta;
  d.matches = Math.max(0, (d.matches||0) + matchesDelta);
}
function teAwardPoints(record, winnerPid, loserPid, winPoints, lossPoints){
  if(record.mode==='sim') return;
  const winnerPlayer = record.players.find(p=>p.id===winnerPid);
  const loserPlayer = loserPid ? record.players.find(p=>p.id===loserPid) : null;
  if(winnerPlayer && winnerPlayer.memberId){ applyDisciplinePoints(DB.members.find(x=>x.id===winnerPlayer.memberId), record.category, winPoints, 1); }
  if(loserPlayer && loserPlayer.memberId){ applyDisciplinePoints(DB.members.find(x=>x.id===loserPlayer.memberId), record.category, lossPoints, 1); }
}
function teReversePoints(record, winnerPid, loserPid, winPoints, lossPoints){
  if(record.mode==='sim') return;
  const winnerPlayer = record.players.find(p=>p.id===winnerPid);
  const loserPlayer = loserPid ? record.players.find(p=>p.id===loserPid) : null;
  if(winnerPlayer && winnerPlayer.memberId){ applyDisciplinePoints(DB.members.find(x=>x.id===winnerPlayer.memberId), record.category, -winPoints, -1); }
  if(loserPlayer && loserPlayer.memberId){ applyDisciplinePoints(DB.members.find(x=>x.id===loserPlayer.memberId), record.category, -lossPoints, -1); }
}
function teReverseAllPoints(record){
  if(record.bracket){
    Object.values(record.bracket.matches).forEach(m=>{
      if(m.status==='done' && m.p2!=null && m.p1!=='BYE' && m.p2!=='BYE'){
        const loserId = m.win===m.p1?m.p2:m.p1;
        teReversePoints(record, m.win, loserId, m.winPoints||0, m.lossPoints||0);
      }
    });
  }
  if(record.rr){
    Object.values(record.rr.matches).forEach(m=>{
      if(m.win!=null) teReversePoints(record, m.win, m.win===m.a?m.b:m.a, m.winPoints!=null?m.winPoints:TE_WIN_POINTS, m.lossPoints!=null?m.lossPoints:TE_LOSS_POINTS);
    });
  }
  if(record.sw){
    record.sw.matches.filter(m=>m.confirmed && !m.bye).forEach(m=>{
      teReversePoints(record, m.winnerId, m.winnerId===m.aId?m.bId:m.aId, m.winPoints!=null?m.winPoints:TE_WIN_POINTS, m.lossPoints!=null?m.lossPoints:TE_LOSS_POINTS);
    });
  }
}
function teGetChampion(record){
  if(record.format==='SE'||record.format==='DE'){ if(!record.bracket) return null; return tbkElimChampion(record.bracket); }
  if(record.format==='RR'){
    if(!record.rr) return null;
    const ids = record.players.map(p=>p.id);
    const total = Object.keys(record.rr.matches).length;
    if(!total) return null;
    const done = Object.values(record.rr.matches).filter(m=>m.win!=null).length;
    if(done<total) return null;
    const st = tbkRrStandings(record.rr, ids, id=>teName(record,id));
    return st[0] ? st[0].id : null;
  }
  if(record.format==='SW'){
    if(!record.sw || !tbkSwissDrawn(record.sw)) return null;
    const lives = record.lives||3;
    const st = tbkSwDerive(record.players.map(p=>p.id), lives, record.sw.matches);
    const alive = record.players.filter(p=>st[p.id].alive);
    return alive.length===1 ? alive[0].id : null;
  }
  return null;
}
function teCheckComplete(record){
  const champId = teGetChampion(record);
  if(champId){ record.champion = teName(record, champId); record.status = 'completed'; }
}

    </div>`;
  };
  return `<div class="card"><div class="card-head"><div><h2>Chế độ</h2><div class="desc">Chọn cách vận hành trước khi tạo sơ đồ thi đấu</div></div></div>
    <div class="card-body padded" style="display:flex;gap:10px;flex-wrap:wrap">
      ${modeCard('op','Vận hành giải thật','Ban tổ chức tự nhập kết quả từng trận, cộng điểm xếp hạng hội viên thật')}
      ${modeCard('sim','Mô phỏng','Tự sinh kết quả ngẫu nhiên để xem trước sơ đồ hoạt động — không cộng điểm thật')}

function teRenderPlayerSeedList(record){
  if(!record.players.length){
    return `<div class="card" style="margin-top:16px"><div class="card-body padded"><div class="empty" style="padding:20px"><i class="ti ti-users"></i><b>Chưa có người chơi</b>Thêm hội viên hoặc khách mời ở tab "Danh sách người chơi" trước khi tạo sơ đồ.</div></div></div>`;
  }
  const chips = record.players.map((p,i)=>`<span class="badge" style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:12.5px">
    <span style="color:var(--hint);font-weight:700">#${i+1}</span> <b>${escapeHtml(p.name)}</b>${p.club?` <span class="cell-muted">· ${escapeHtml(p.club)}</span>`:''}
  </span>`).join('');
  return `<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Danh sách người chơi</h2><div class="desc">${record.players.length} người · Thứ tự hạt giống theo thứ tự thêm vào danh sách</div></div></div>
    <div class="card-body padded" style="display:flex;flex-wrap:wrap;gap:8px">${chips}</div>
  </div>`;

function teRenderSeedPairPreview(record){
  const n = record.players.length;
  if(n<2) return '';
  const size = tbkNextPow2(n);
  const seeds = tbkBracketSeeds(size);
  const pid = s=>(s<=n?record.players[s-1]:null);
  const rows = [];
  for(let i=0;i<size/2;i++){
    const a = pid(seeds[2*i]), b = pid(seeds[2*i+1]);
    rows.push({a,b});
  }
  const fixtures = rows.map(r=>`<div class="tbk-fix">
    <span class="pn">${r.a?`<span style="color:var(--hint);font-weight:700">#${record.players.indexOf(r.a)+1}</span> ${escapeHtml(r.a.name)}`:''}</span>
    <span class="vs">vs</span>
    <span class="pn r">${r.b?`${escapeHtml(r.b.name)} <span style="color:var(--hint);font-weight:700">#${record.players.indexOf(r.b)+1}</span>`:'<span class="cell-muted">(miễn đấu — BYE)</span>'}</span>
  </div>`).join('');
  return `<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Xem trước bắt cặp vòng 1</h2><div class="desc">Ghép theo hạt giống${size>n?` · ${size-n} người được miễn đấu (BYE) vòng đầu`:''} — sẽ được chốt khi tạo sơ đồ</div></div></div>
    <div class="card-body padded">${fixtures}</div>
  </div>`;
}
function teStartBracket(record){
  record.players.forEach((p,i)=>{ p.seed=i+1; });
  const fmt = record.format || 'SE';
  const seedIds = record.players.map(p=>p.id);
  if(fmt==='SE') record.bracket = tbkGenSE(seedIds);
  else if(fmt==='DE') record.bracket = tbkGenDE(seedIds);
  else if(fmt==='RR') record.rr = tbkGenRR(seedIds);
  else record.sw = {round:1, matches:[], seq:1};
  if(record.status==='upcoming') record.status = 'ongoing';
  teRrTab = 0;
  teView = {tx:40, ty:30, scale:1};
  saveDB();
  renderSidebar();
  showToast('Đã tạo sơ đồ thi đấu');
  renderContent();
  if(fmt==='SE'||fmt==='DE') setTimeout(()=>teFitBracket(record), 30);
}
function teResetBracket(record){
  if(!confirm('Tạo lại sơ đồ sẽ xóa toàn bộ kết quả đã nhập và hoàn tác điểm xếp hạng đã cộng (nếu có). Danh sách người chơi được giữ nguyên. Tiếp tục?')) return;
  teReverseAllPoints(record);
  record.bracket = null; record.rr = null; record.sw = null;
  if(record.status==='completed') record.status = 'ongoing';
  record.champion = '';
  recomputeMemberRanking();
  saveDB();
  renderSidebar();
  showToast('Đã đặt lại sơ đồ thi đấu');
  renderContent();
}

/* ---- SE / DE bracket ---- */
function teLayoutSE(eng){
  const rounds=eng.rounds, CW=188, CH=62, GX=66, GY=20;
  const pos={}; const rh=CH+GY;
  rounds[0].forEach((id,i)=>pos[id]={x:0,y:i*rh});
  for(let r=1;r<rounds.length;r++) rounds[r].forEach((id,i)=>{
    const c1=pos[rounds[r-1][2*i]], c2=pos[rounds[r-1][2*i+1]]; pos[id]={x:r*(CW+GX), y:(c1.y+c2.y)/2};
  });
  const labels = rounds.map((rd,r)=>({x:r*(CW+GX), txt:tbkRoundName(r, rounds.length)}));
  return {pos, W:rounds.length*(CW+GX), H:rounds[0].length*rh, labels, CW, CH};
}
function teLayoutDE(eng){
  const WB=eng.WB, LB=eng.LB, CW=188, CH=62, GX=66, GY=18;
  const pos={}; const rh=CH+GY;
  WB[0].forEach((id,i)=>pos[id]={x:0,y:i*rh});
  for(let r=1;r<WB.length;r++) WB[r].forEach((id,i)=>{ const c1=pos[WB[r-1][2*i]], c2=pos[WB[r-1][2*i+1]]; pos[id]={x:r*(CW+GX), y:(c1.y+c2.y)/2}; });
  const wbH=WB[0].length*rh, band=wbH+50;
  LB.forEach((col,r)=>{ const x=r*(CW+GX); col.forEach((id,i)=>pos[id]={x, y:band+i*rh}); });
  const gfx = Math.max(WB.length, LB.length)*(CW+GX);
  pos[eng.gfId] = {x:gfx, y:(wbH)/2-CH/2};
  if(eng.matches[eng.gf2Id].status!=='void') pos[eng.gf2Id] = {x:gfx, y:wbH/2+rh};
  const labels=[]; WB.forEach((c,r)=>labels.push({x:r*(CW+GX), y:-22, txt:'WB '+tbkRoundName(r, WB.length)}));
  LB.forEach((c,r)=>labels.push({x:r*(CW+GX), y:band-22, txt:'LB Vòng '+(r+1)}));
  labels.push({x:gfx, y:-22, txt:'Chung kết'});
  const maxLBy = band + Math.max(...LB.map(c=>c.length))*rh;
  return {pos, W:gfx+CW, H:Math.max(wbH, maxLBy), labels, CW, CH};
}
function teMatchCardHtml(record, m, p, CW){
  const row=(pid,won)=>{
    const bye = pid==='BYE';
    const nm = pid==null ? '<span style="color:var(--hint)">— chờ —</span>' : (bye?'BYE':escapeHtml(teName(record,pid)));
    const player = (pid && pid!=='BYE') ? record.players.find(x=>x.id===pid) : null;
    const seed = player ? `#${player.seed}` : '';
    const sc = pid===m.p1 ? m.s1 : (pid===m.p2 ? m.s2 : null);
    return `<div class="br ${won?'w':''} ${bye?'bye':''}"><span class="sd">${seed}</span><span class="pn">${nm}</span><span class="sc">${sc!=null?sc:''}</span></div>`;
  };
  const aw = m.win!=null && m.win===m.p1, bw = m.win!=null && m.win===m.p2;
  const cls = (m.br==='GF'||m.br==='GF2') ? 'tbk-m gf' : 'tbk-m '+(m.status==='ready'?'ready':'');
  return `<div class="${cls}" data-tbm="${m.id}" style="left:${p.x}px;top:${p.y}px;width:${CW}px">${row(m.p1,aw)}${row(m.p2,bw)}</div>`;
}
function teDrawBracket(record){
  const eng = record.bracket;
  const stage = document.getElementById('tbkStage');
  if(!stage || !eng) return;
  const L = eng.type==='SE' ? teLayoutSE(eng) : teLayoutDE(eng);
  const M = eng.matches;
  let svg = `<svg class="tbk-conn" width="${L.W+200}" height="${L.H+120}">`;
  for(const id in M){
    const m=M[id]; const p=L.pos[id]; if(!p) continue;
    [['winTo','#22A56F'],['loseTo','#CD5B45']].forEach(([key,col])=>{
      const t=m[key]; if(!t || !L.pos[t[0]]) return;
      const tp=L.pos[t[0]];
      const x1=p.x+L.CW, y1=p.y+L.CH/2, x2=tp.x, y2=tp.y+(t[1]===1?16:46);
      const mx=(x1+x2)/2;
      svg += `<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" stroke="${col}" stroke-width="1.5" fill="none" opacity="${key==='loseTo'?0.5:0.85}"/>`;
    });
  }
  svg += `</svg>`;
  let cards='';
  for(const id in M){ const m=M[id]; const p=L.pos[id]; if(!p) continue; if(m.br==='GF2'&&m.status==='void') continue; cards += teMatchCardHtml(record, m, p, L.CW); }
  const labs = L.labels.map(l=>`<div class="tbk-rlabel" style="left:${l.x}px;top:${(l.y!=null?l.y:-22)}px">${escapeHtml(l.txt)}</div>`).join('');
  stage.style.transform = `translate(${teView.tx}px,${teView.ty}px) scale(${teView.scale})`;
  stage.style.paddingTop = '28px';
  stage.innerHTML = svg+labs+cards;
  const champId = tbkElimChampion(eng);
  const label = document.getElementById('tbkLabel');
  if(label) label.innerHTML = champId ? `<i class="ti ti-trophy" style="color:var(--gold)"></i> Vô địch: <span class="tbk-champ">${escapeHtml(teName(record,champId))}</span>` : 'Kéo để di chuyển · cuộn để phóng to · bấm trận để nhập kết quả';
}
function teBindBracketView(record){
  teDrawBracket(record);
  const viewEl = document.getElementById('tbkView');
  if(!viewEl) return;
  viewEl.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = viewEl.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const ns = Math.min(2, Math.max(.35, teView.scale*(e.deltaY<0?1.12:0.89)));
    teView.tx = mx-(mx-teView.tx)*(ns/teView.scale);
    teView.ty = my-(my-teView.ty)*(ns/teView.scale);
    teView.scale = ns;
    teApplyView();
  }, {passive:false});
  viewEl.onpointerdown = e=>{ teDragInfo={x:e.clientX,y:e.clientY,tx:teView.tx,ty:teView.ty,moved:false}; viewEl.classList.add('drag'); viewEl.setPointerCapture(e.pointerId); };
  viewEl.onpointermove = e=>{ if(!teDragInfo) return; const dx=e.clientX-teDragInfo.x, dy=e.clientY-teDragInfo.y; if(Math.abs(dx)+Math.abs(dy)>4) teDragInfo.moved=true; teView.tx=teDragInfo.tx+dx; teView.ty=teDragInfo.ty+dy; teApplyView(); };
  viewEl.onpointerup = e=>{
    const moved = teDragInfo && teDragInfo.moved;
    viewEl.classList.remove('drag'); teDragInfo=null;
    if(!moved){ const card=e.target.closest('.tbk-m'); if(card) teOpenMatchModal(card.getAttribute('data-tbm')); }
  };
  document.querySelectorAll('[data-tbz]').forEach(b=>b.addEventListener('click', ()=>{
    const z=b.getAttribute('data-tbz');
    if(z==='in') teView.scale=Math.min(2, teView.scale*1.2);
    else if(z==='out') teView.scale=Math.max(.35, teView.scale/1.2);
    else return teFitBracket(record);
    teApplyView();
  }));
}
function teApplyView(){ const st=document.getElementById('tbkStage'); if(st) st.style.transform=`translate(${teView.tx}px,${teView.ty}px) scale(${teView.scale})`; }
function teFitBracket(record){
  const eng = record.bracket; if(!eng) return;
  const L = eng.type==='SE' ? teLayoutSE(eng) : teLayoutDE(eng);
  const v = document.getElementById('tbkView'); if(!v) return;
  const r = v.getBoundingClientRect();
  const sc = Math.min((r.width-40)/(L.W+40), (r.height-60)/(L.H+60), 1.1);
  teView.scale = Math.max(.35, sc); teView.tx = 20; teView.ty = 40; teApplyView();
}
function teOpenMatchModal(mid){

  `;
  document.querySelector('#modalOverlay .modal').classList.remove('wide');
  document.getElementById('modalDeleteBtn').style.display = 'none';
  document.getElementById('modalSaveBtn').style.display = '';
  document.getElementById('modalOverlay').classList.add('on');
  const auto = document.getElementById('tbmAutoBtn');
  if(auto) auto.addEventListener('click', ()=>{

    document.getElementById('tbm_s_'+m.p1).value = r.win===m.p1?r.ws:r.ls;

function closeTeMatchModal(){ document.getElementById('modalOverlay').classList.remove('on'); teMatchModal=null; }
function saveTeMatchModal(){
  const record = teRecordFromView();
  if(!record || !teMatchModal || !record.bracket) return;
  const mid = teMatchModal.mid;
  const M = record.bracket.matches; const m = M[mid];
  if(!m) return;

  const winPoints = Number(document.getElementById('tbm_wpts').value)||0;
  const lossPoints = Number(document.getElementById('tbm_lpts').value)||0;
  teSubmitElimResult(record, mid, s1, s2, winPoints, lossPoints);

function teSubmitElimResult(record, mid, s1, s2, winPoints, lossPoints){
  const M = record.bracket.matches; const m = M[mid];
  const winId = s1>s2 ? m.p1 : m.p2;
  if(m.status==='done'){
    const t = m.winTo && M[m.winTo[0]];
    if(t && t.status==='done'){ showToast('Không thể sửa: trận sau đã có kết quả. Hãy sửa từ trận muộn nhất.', true); return; }
    const oldLoserId = (m.win===m.p1?m.p2:m.p1);
    teReversePoints(record, m.win, oldLoserId, m.winPoints||0, m.lossPoints||0);
    if(m.winTo){ const tm=M[m.winTo[0]]; if(m.winTo[1]===1) tm.p1=null; else tm.p2=null; tm.status='wait'; }
    if(m.loseTo){ const tm=M[m.loseTo[0]]; if(m.loseTo[1]===1) tm.p1=null; else tm.p2=null; tm.status='wait'; }
  }
  const loseId = tbkDecide(M, mid, winId, s1, s2);
  m.winPoints = winPoints; m.lossPoints = lossPoints; m.decidedAt = Date.now();
  if(m.br==='GF'){
    const g2 = M[record.bracket.gf2Id];
    if(winId===m.p2){ g2.status='ready'; g2.p1=m.p1; g2.p2=m.p2; } else { g2.status='void'; }
  }
  tbkResolveByes(M);
  teAwardPoints(record, winId, loseId, winPoints, lossPoints);
  recomputeMemberRanking();
  teCheckComplete(record);
  saveDB();
  renderSidebar();
  showToast('Đã ghi nhận kết quả và cập nhật bảng xếp hạng');
  renderContent();
}

function teRenderRR(record){
  const rr = record.rr;

    <tbody>${st.map((s,i)=>`<tr><td class="cell-muted">${i+1}</td><td><b>${escapeHtml(teName(record,s.id))}</b></td><td style="text-align:center">${s.w}</td><td style="text-align:center">${s.l}</td><td style="text-align:center">${s.gd>0?'+':''}${s.gd}</td><td style="text-align:center"><b>${s.pts}</b></td></tr>`).join('')}</tbody></table></div></div>`;

  if(teRrTab>=rounds.length) teRrTab=0;
