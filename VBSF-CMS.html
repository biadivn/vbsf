  const cur = rounds[teRrTab] || [];
  const fixtures = cur.map(id=>{
    const m=rr.matches[id]; const isDone=m.win!=null; const aw=m.win===m.a;
    if(isDone) return `<div class="tbk-fix"><span class="pn ${aw?'w':'l'}">${escapeHtml(teName(record,m.a))}</span><span class="tbk-res" style="padding:3px 9px;font-size:13px">${m.s1}–${m.s2}</span><span class="pn r ${aw?'l':'w'}">${escapeHtml(teName(record,m.b))}</span><button class="btn-icon" data-tbredit="${id}" title="Sửa"><i class="ti ti-edit"></i></button></div>`;
    return `<div class="tbk-fix"><span class="pn">${escapeHtml(teName(record,m.a))}</span><input type="number" min="0" id="tb_ra_${id}"><span class="vs">–</span><input type="number" min="0" id="tb_rb_${id}"><span class="pn r">${escapeHtml(teName(record,m.b))}</span><button class="btn-icon" data-tbrsave="${id}" title="Lưu"><i class="ti ti-device-floppy"></i></button></div>`;
  }).join('') || `<div class="empty">Vòng này không có trận.</div>`;
  const fix = `<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Lịch thi đấu</h2></div></div>${tabs}<div class="card-body padded">${fixtures}</div></div>`;
  return tbl+fix;
}

/* ---- Swiss (lives) ---- */
function teRenderSwiss(record){
  const lives = record.lives||3;
  const sw = record.sw;
  const st = tbkSwDerive(record.players.map(p=>p.id), lives, sw.matches);
  const sorted = record.players.slice().sort((A,B)=>{
    const a=st[A.id], b=st[B.id];
    if(a.alive!==b.alive) return a.alive?-1:1;
    if(a.alive){ if(a.losses!==b.losses) return a.losses-b.losses; if(a.wins!==b.wins) return b.wins-a.wins; return tbkSwSos(st,b.id)-tbkSwSos(st,a.id); }
    return b.wins-a.wins;
  });
  const aliveCount = record.players.filter(p=>st[p.id].alive).length;
  let champHtml = '';
  if(aliveCount<=1 && tbkSwissDrawn(sw)){ const c=sorted[0]; champHtml = `<div class="tbk-champbar"><i class="ti ti-trophy" style="color:var(--gold)"></i> Vô địch: ${escapeHtml(c.name)}</div>`; }
  const lb = `<div class="card"><div class="card-head"><div><h2>Bảng xếp hạng</h2><div class="desc">${record.players.length} người · ${lives} mạng</div></div></div>
    <div class="card-body padded" style="padding-top:8px">${champHtml}${sorted.map((p,i)=>{
      const s=st[p.id]; const dead=!s.alive;
      const t = lives<=1?0:s.losses/(lives-1); const h=Math.round(150-t*142);
      let balls='<div class="tbk-lives">'; for(let k=0;k<lives;k++) balls+=`<div class="tbk-ball ${k<s.left?'':'gone'}"></div>`; balls+='</div>';
      return `<div class="tbk-row ${dead?'dead':''}"><div class="rk">${i+1}</div><div class="who"><b>${escapeHtml(p.name)}</b></div>
        ${dead?'<span class="tbk-grp" style="color:var(--hint);background:var(--surface)">—</span>':`<span class="tbk-grp" style="color:hsl(${h} 62% 34%);background:hsl(${h} 55% 92%)">${s.losses} thua</span>`}
        <div class="tbk-wl"><b>${s.wins}</b>–${s.losses}</div>${dead?'<div class="tbk-deadtag">Loại</div>':balls}</div>`;
    }).join('')}</div></div>`;

  const ms = tbkSwRoundMatches(sw);
  const roundDone = tbkSwRoundComplete(sw);
  const filled = ms.filter(m=>m.confirmed).length;
  let rp;
  if(!tbkSwissDrawn(sw)){
    rp = `<div class="card-body padded" style="text-align:center"><div style="font-weight:700;margin-bottom:4px">Vòng ${sw.round}</div><div class="cell-muted" style="margin-bottom:14px">${aliveCount} người còn trong giải.</div><button class="btn btn-primary" id="tbSwDrawBtn"><i class="ti ti-dice-5"></i> Bốc thăm vòng ${sw.round}</button></div>`;
  } else {
    rp = `<div class="card-body padded">${ms.map(m=>teSwMatchCard(record,m)).join('')}</div>`;
    if(roundDone && aliveCount>1) rp += `<div class="form-actions" style="justify-content:center;border-top:1px solid var(--line);padding:14px"><button class="btn btn-primary" id="tbSwNextBtn">Vòng tiếp theo <i class="ti ti-arrow-right"></i> (Vòng ${sw.round+1})</button></div>`;
  }
  const panel = `<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Vòng ${sw.round}</h2><div class="desc">${!tbkSwissDrawn(sw)?'chưa bốc thăm':roundDone?'Hoàn tất '+filled+'/'+ms.length:'Đã nhập '+filled+'/'+ms.length}</div></div></div>${rp}</div>`;
  return `<div class="tbk-grid2"><div>${lb}</div><div>${panel}${teSwLog(record)}</div></div>`;
}
function teSwMatchCard(record,m){
  const A = record.players.find(p=>p.id===m.aId);
  if(m.bye) return `<div class="tbk-fix"><span class="pn w">${escapeHtml(A?A.name:'—')}</span><span class="tbk-byebadge">Miễn đấu</span></div>`;
  const B = record.players.find(p=>p.id===m.bId);
  if(m.confirmed){
    const aw = m.winnerId===m.aId;
    return `<div class="tbk-fix"><span class="pn ${aw?'w':'l'}">${escapeHtml(A?A.name:'—')}</span><span class="tbk-res" style="padding:3px 9px;font-size:13px">${m.sa}–${m.sb}</span><span class="pn r ${aw?'l':'w'}">${escapeHtml(B?B.name:'—')}</span><button class="btn-icon" data-tbswedit="${m.id}" title="Sửa"><i class="ti ti-edit"></i></button></div>`;
  }
  return `<div class="tbk-fix"><span class="pn">${escapeHtml(A?A.name:'—')}</span><input type="number" min="0" id="tb_sa_${m.id}"><span class="vs">–</span><input type="number" min="0" id="tb_sb_${m.id}"><span class="pn r">${escapeHtml(B?B.name:'—')}</span><button class="btn-icon" data-tbswsave="${m.id}" title="Lưu"><i class="ti ti-device-floppy"></i></button></div>`;
}
function teSwLog(record){
  const sw = record.sw;
  const conf = sw.matches.filter(m=>m.confirmed);
  const rows = conf.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  const body = rows.length ? rows.map(r=>{
    const A = record.players.find(p=>p.id===r.aId);
    let d;
    if(r.bye) d = `<span class="tbk-winner">${escapeHtml(A?A.name:'—')}</span> <span class="tbk-loser">— miễn đấu</span>`;
    else { const B=record.players.find(p=>p.id===r.bId); const aw=r.winnerId===r.aId;
      d = `<span class="${aw?'tbk-winner':'tbk-loser'}">${escapeHtml(A?A.name:'—')}</span> <b>${r.sa}–${r.sb}</b> <span class="${aw?'tbk-loser':'tbk-winner'}">${escapeHtml(B?B.name:'—')}</span>`; }
    return `<div class="tbk-lg"><div class="t">${r.ts?teFmtTime(r.ts):''}</div><div class="rr">V${r.round}</div><div>${d}</div></div>`;
  }).join('') : `<div class="empty" style="padding:20px">Chưa có trận.</div>`;
  return `<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Nhật ký trận đấu</h2><div class="desc">${rows.length} trận</div></div></div><div class="tbk-logtable">${body}</div></div>`;
}
function teSaveSwissResult(mid){
  const record = teRecordFromView(); if(!record) return;
  const m = record.sw.matches.find(x=>x.id===Number(mid)); if(!m) return;
  const sa = Number(document.getElementById('tb_sa_'+mid).value);
  const sb = Number(document.getElementById('tb_sb_'+mid).value);
  if(!Number.isFinite(sa) || !Number.isFinite(sb) || sa===sb){ showToast('Vui lòng nhập tỷ số hợp lệ.', true); return; }
  m.sa=sa; m.sb=sb; m.winnerId = sa>sb ? m.aId : m.bId; m.confirmed=true; m.ts=Date.now();
  m.winPoints = TE_WIN_POINTS; m.lossPoints = TE_LOSS_POINTS;
  teAwardPoints(record, m.winnerId, m.winnerId===m.aId?m.bId:m.aId, m.winPoints, m.lossPoints);
  recomputeMemberRanking();
  teCheckComplete(record);
  saveDB();

function teEditSwissResult(mid){

/* ---- Simulator ---- */
function teSimStep(n){
  const record = teRecordFromView();
  if(!record) return;
  for(let c=0;c<n;c++){
    if(record.format==='SE' || record.format==='DE'){
      const M = record.bracket.matches;
      const ready = Object.values(M).filter(m=>m.status==='ready' && m.p1!=='BYE' && m.p2!=='BYE' && m.p1!=null && m.p2!=null);
      if(!ready.length) break;
      const m = ready[0];
      const r = tbkSimScore(m.p1, m.p2, pid=>tePlayerRating(record,pid));
      tbkDecide(M, m.id, r.win, r.win===m.p1?r.ws:r.ls, r.win===m.p1?r.ls:r.ws);
      if(m.br==='GF'){ const g2=M[record.bracket.gf2Id]; if(r.win===m.p2){ g2.status='ready'; g2.p1=m.p1; g2.p2=m.p2; } else g2.status='void'; }
      tbkResolveByes(M);
    } else if(record.format==='RR'){
      const M = record.rr.matches;
      const open = Object.values(M).filter(m=>m.win==null);
      if(!open.length) break;
      const m = open[0];
      const r = tbkSimScore(m.a, m.b, pid=>tePlayerRating(record,pid));
      m.win=r.win; m.s1=r.win===m.a?r.ws:r.ls; m.s2=r.win===m.a?r.ls:r.ws;
    } else if(record.format==='SW'){
      if(!tbkSwissDrawn(record.sw)) tbkSwissDraw(record.sw, record.players, record.lives||3, id=>teName(record,id));
      const open = tbkSwRoundMatches(record.sw).filter(m=>!m.confirmed && !m.bye);
      if(open.length){
        const m = open[0];
        const r = tbkSimScore(m.aId, m.bId, pid=>tePlayerRating(record,pid));
        m.sa=r.win===m.aId?r.ws:r.ls; m.sb=r.win===m.aId?r.ls:r.ws; m.winnerId=r.win; m.confirmed=true; m.ts=Date.now();
      } else if(tbkSwRoundComplete(record.sw)){
        if(!tbkSwissNext(record.sw, record.players, record.lives||3)) break;
      }
    }
  }
  teCheckComplete(record);
  saveDB();
  renderSidebar();
  renderContent();
  if(record.format==='SE'||record.format==='DE') teApplyView();
}

async function teSaveInfo(){

  c.fields.forEach(f=>{
    let val = document.getElementById('f_'+f.key).value;
    if(f.type==='number' && val!=='') val = Number(val);
    if(f.required && (val===''||val===undefined||val===null)) missingRequired = true;

  });

  if(isNew){
    data.id = uid();

function teImportCsv(){
  const id = currentView.slice('tournament-edit:'.length);
  const record = teRecord(id);
  if(!record) return;
  const raw = document.getElementById('te_csv').value;
  teCsvText = raw;
  const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length===0){ showToast('Vui lòng dán hoặc tải lên danh sách', true); return; }
  let added = 0;
  lines.forEach(line=>{
    const cols = line.split(',').map(c=>c.trim());
    const name = cols[0];
    if(!name) return;
    const idToken = cols[1] || '';
    const club = cols[2] || '';
    let member = null;
    if(idToken) member = DB.members.find(m=>m.phone===idToken || m.code===idToken);
    if(member && record.players.some(p=>p.memberId===member.id)) return;
    record.players.push({
      id:uid(),
      memberId: member ? member.id : null,
      name: member ? member.name : name,
      club: member ? (member.club||club) : club,
      registeredAt: Date.now(),
      feeStatus: 'unpaid'
    });
    added++;
  });
  teCsvText = '';
  saveDB();
  renderSidebar();
  showToast(`Đã nhập ${added} người chơi từ danh sách`);

function teRemovePlayer(pid){
  const id = currentView.slice('tournament-edit:'.length);
  const record = teRecord(id);

  const inBracket = record.bracket && Object.values(record.bracket.matches).some(m=>m.p1===pid || m.p2===pid);
  const inRR = record.rr && Object.values(record.rr.matches).some(m=>m.a===pid || m.b===pid);
  const inSw = record.sw && record.sw.matches.some(m=>m.aId===pid || m.bId===pid);
  if(inBracket || inRR || inSw){
    showToast('Không thể xóa: người chơi đã có trong sơ đồ thi đấu. Hãy "Tạo lại sơ đồ" trước.', true);
    return;

  saveDB();

  showToast('Đã xóa người chơi');
  renderContent();
}

function recomputeMemberRanking(){
  const categories = new Set();
  DB.members.forEach(m=>(m.disciplines||[]).forEach(d=>categories.add(d.category)));
  categories.forEach(cat=>{
    const entries = [];
    DB.members.forEach(m=>{ const d=(m.disciplines||[]).find(x=>x.category===cat); if(d) entries.push(d); });
    const prevRank = new Map(entries.map(d=>[d, d.rank]));
    entries.sort((a,b)=>(b.points||0)-(a.points||0));
    entries.forEach((d,i)=>{
      const newRank = i+1;
      const oldRank = prevRank.get(d) ?? newRank;
      const delta = oldRank - newRank;
      d.rank = newRank;
      d.trend = delta>0 ? 'up' : (delta<0 ? 'down' : 'eq');
      d.trendValue = Math.abs(delta);
    });
  });
}

    `<div class="fld ${f.span2?'span2':''}"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label>${renderField(f, pageModal.values[f.key])}</div>`
  ).join('') + `<div class="hint" style="margin-top:2px">Bạn có thể chỉnh slug và metadata SEO ngay trong màn hình chi tiết của trang sau khi tạo.</div></div>`;
  document.getElementById('modalOverlay').classList.add('on');
}
async function savePageModal(){
  const title = document.getElementById('f_title').value.trim();
  if(!title){ showToast('Vui lòng nhập tên trang', true); return; }
  const slug = slugify(title);
  const base = slug.replace(/^\//,'') || 'trang-moi';
  let pageKey = base, i = 2;
  while(getAllPageKeys().includes(pageKey)) pageKey = `${base}-${i++}`;
  DB.customPages[pageKey] = {label:title, icon:'ti-file', path:slug};
  DB.customSections[pageKey] = [];
  DB.pageSections[pageKey] = [];
  DB.pageSectionKeysEverAdded[pageKey] = [];
  DB.pageMeta[pageKey] = {slug, title, metaTitle:'', metaDescription:''};
  await saveDB();
  closePageModal();
  setView('page:'+pageKey);
  showToast('Đã tạo trang mới');
}
function closePageModal(){
  pageModal = null;
  document.getElementById('modalOverlay').classList.remove('on');
}


/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vbsf-cms-data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Đã xuất file JSON');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      DB = parsed;
      await saveDB();
      renderSidebar(); renderTopbar(); renderContent();
      showToast('Đã nhập dữ liệu thành công');
    }catch(err){
      showToast('File JSON không hợp lệ', true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
function stripHtml(html){ return String(html??'').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
function fmtDate(d){
  if(!d) return '—';
  const parts = String(d).split('-');
  if(parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return d;
}
let toastTimer=null;
function showToast(msg, isError){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  const icon = t.querySelector('i');
  icon.className = isError ? 'ti ti-alert-circle' : 'ti ti-circle-check';
  icon.style.color = isError ? 'var(--danger)' : 'var(--tag-green)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* =========================================================
   STRAPI DATA — đồng bộ các collection nội dung (news, partners,
   library_docs, library_media) và 2 singleton (settings, contact)
   với Strapi. Dùng chung apiFetch()/getStoredTokens() từ auth.js.

   Ghi chú: tournaments, members, members_org CHƯA được nối vào Strapi
   ở đây — các collection này còn phụ thuộc dữ liệu component/quan hệ
   phức tạp (giải đấu: bracket/players/prizes; hội viên: disciplines/
   freeMatches) và bộ máy giải đấu cục bộ (tournament-editor.js), nên
   việc đồng bộ đầy đủ để lại cho một lần làm riêng.
   ========================================================= */
const SINGLETON_API_PATH = { settings:'setting', contact:'contact-info' };

async function uploadDataUri(dataUri, filenameHint){
  const blobRes = await fetch(dataUri);
  const blob = await blobRes.blob();
  const ext = (blob.type.split('/')[1] || 'png');
  const form = new FormData();
  form.append('files', blob, `${filenameHint}-${Date.now()}.${ext}`);
  const { jwt } = getStoredTokens();
  const headers = {};
  if(jwt) headers['Authorization'] = 'Bearer '+jwt;
  const res = await fetch(STRAPI_URL+'/api/upload', { method:'POST', headers, body: form });
  if(!res.ok) throw new Error('upload failed');
  const out = await res.json();
  return out[0].id;
}

function mediaUrl(media){
  if(!media || !media.url) return '';
  return media.url.startsWith('http') ? media.url : STRAPI_URL + media.url;
}

function mapStrapiEntryToRecord(c, item){
  const rec = { id: item.documentId };
  c.fields.forEach(f=>{
    rec[f.key] = f.type==='image' ? mediaUrl(item[f.key]) : item[f.key];
  });
  return rec;
}

async function refreshRemoteCollection(key){
  const c = COLLECTIONS[key];
  try{
    let page = 1, all = [], pageCount = 1;
    do{
      const res = await apiFetch(`/api/${c.apiPath}?pagination[page]=${page}&pagination[pageSize]=100&populate=*`);
      if(!res.ok) break;
      const out = await res.json();
      all = all.concat(out.data || []);
      pageCount = (out.meta && out.meta.pagination && out.meta.pagination.pageCount) || 1;
      page++;
    } while(page <= pageCount);
    DB[key] = all.map(item=>mapStrapiEntryToRecord(c, item));
  }catch(e){
    DB[key] = DB[key] || [];
  }
}

async function saveRemoteCollectionRecord(key, id, data){
  const c = COLLECTIONS[key];
  try{
    const payload = {};
    for(const f of c.fields){
      if(f.type==='image'){
        const val = data[f.key];
        if(val && val.startsWith('data:')) payload[f.key] = await uploadDataUri(val, f.key);
        else if(val === '') payload[f.key] = null;
        continue;
      }
      payload[f.key] = data[f.key];
    }
    const method = id ? 'PUT' : 'POST';
    const url = id ? `/api/${c.apiPath}/${id}` : `/api/${c.apiPath}`;
    const res = await apiFetch(url, { method, body: JSON.stringify({ data: payload }) });
    if(!res.ok){
      const out = await res.json().catch(()=>({}));
      showToast((out.error && out.error.message) || 'Không thể lưu', true);
      return false;
    }
    await refreshRemoteCollection(key);
    return true;
  }catch(e){
    showToast('Không thể kết nối máy chủ Strapi', true);
    return false;
  }
}

async function deleteRemoteCollectionRecord(key, id){
  const c = COLLECTIONS[key];
  try{
    const res = await apiFetch(`/api/${c.apiPath}/${id}`, { method:'DELETE' });
    if(!res.ok){ showToast('Không thể xóa', true); return false; }
    await refreshRemoteCollection(key);
    return true;
  }catch(e){
    showToast('Không thể kết nối máy chủ Strapi', true);
    return false;
  }
}

async function refreshSingletonFromApi(key){
  const apiPath = SINGLETON_API_PATH[key];
  try{
    const res = await apiFetch(`/api/${apiPath}`);
    if(!res.ok) return; // singleton chưa có dữ liệu — giữ nguyên seed mặc định
    const out = await res.json();
    if(out.data) DB[key] = Object.assign({}, DB[key], out.data);
  }catch(e){ /* Strapi không truy cập được — giữ dữ liệu hiện có */ }
}

async function saveSingletonToApi(key, data){
  const apiPath = SINGLETON_API_PATH[key];
  try{
    const res = await apiFetch(`/api/${apiPath}`, { method:'PUT', body: JSON.stringify({ data }) });
    if(!res.ok){
      const out = await res.json().catch(()=>({}));
      showToast((out.error && out.error.message) || 'Không thể lưu', true);
      return false;
    }
    return true;
  }catch(e){
    showToast('Không thể kết nối máy chủ Strapi', true);
    return false;
  }
}

/* =========================================================
   AUTH — Đăng nhập, đăng xuất, đổi/đặt lại mật khẩu, quản lý tài khoản
   Xác thực thật qua Strapi (plugin Users & Permissions), KHÔNG dùng dữ liệu giả.
   ========================================================= */
// Local dev (file:// hoặc localhost): Strapi chạy riêng ở cổng 1337.
// Trên live: Strapi được nginx reverse-proxy dưới CÙNG domain với CMS
// (xem deploy/nginx/vbsf-cms.biadi.vn.conf), nên dùng path tương đối (same-origin).
const STRAPI_URL = (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:1337' : '';
const CMS_JWT_KEY = 'vbsf_cms_jwt';
const CMS_REFRESH_KEY = 'vbsf_cms_refresh';
// Vai trò "Authenticated" mặc định của Strapi users-permissions (id=1 trên cài đặt mới).
const CMS_ACCOUNT_ROLE_ID = 1;

let CMS_CURRENT_USER = null;

function getStoredTokens(){
  try{
    return { jwt: localStorage.getItem(CMS_JWT_KEY), refreshToken: localStorage.getItem(CMS_REFRESH_KEY) };
  }catch(e){ return { jwt:null, refreshToken:null }; }
}
function storeTokens(jwt, refreshToken){
  try{
    if(jwt) localStorage.setItem(CMS_JWT_KEY, jwt);
    if(refreshToken) localStorage.setItem(CMS_REFRESH_KEY, refreshToken);
  }catch(e){}
}
function clearTokens(){
  try{ localStorage.removeItem(CMS_JWT_KEY); localStorage.removeItem(CMS_REFRESH_KEY); }catch(e){}
}

async function refreshAccessToken(){
  const { refreshToken } = getStoredTokens();
  if(!refreshToken) return false;
  try{
    const res = await fetch(STRAPI_URL+'/api/auth/refresh', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ refreshToken })
    });
    if(!res.ok) return false;
    const out = await res.json();
    storeTokens(out.jwt, out.refreshToken);
    return true;
  }catch(e){ return false; }
}

async function apiFetch(path, options, retry){
  options = options || {};
  if(retry===undefined) retry = true;
  const { jwt } = getStoredTokens();
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(jwt) headers['Authorization'] = 'Bearer '+jwt;
  const res = await fetch(STRAPI_URL+path, Object.assign({}, options, { headers }));
  if(res.status===401 && retry){
    const refreshed = await refreshAccessToken();
    if(refreshed) return apiFetch(path, options, false);
  }
  return res;
}

async function refreshAccountsFromApi(){
  try{
    const res = await apiFetch('/api/users');
    if(!res.ok){ DB.accounts = []; return; }
    const users = await res.json();
    DB.accounts = users.map(u=>({ id:String(u.id), displayName:u.displayName||'', username:u.username }));
  }catch(e){ DB.accounts = []; }
}

async function saveRemoteAccount(id, data){
  try{
    let res;
    if(id){
      const body = { displayName: data.displayName, username: data.username, email: data.username };
      if(data.password) body.password = data.password;
      res = await apiFetch('/api/users/'+id, { method:'PUT', body: JSON.stringify(body) });
    } else {
      res = await apiFetch('/api/users', { method:'POST', body: JSON.stringify({
        username: data.username, email: data.username, password: data.password,
        displayName: data.displayName, confirmed: true, role: CMS_ACCOUNT_ROLE_ID
      })});
    }
    if(!res.ok){
      const out = await res.json().catch(()=>({}));
      showToast(out.error && out.error.message || 'Không thể lưu tài khoản', true);
      return false;
    }
    await refreshAccountsFromApi();
    return true;
  }catch(e){
    showToast('Không thể kết nối máy chủ Strapi', true);
    return false;
  }
}

async function deleteRemoteAccount(id){
  try{
    const res = await apiFetch('/api/users/'+id, { method:'DELETE' });
    if(!res.ok){ showToast('Không thể xóa tài khoản', true); return false; }
    await refreshAccountsFromApi();
    return true;
  }catch(e){
    showToast('Không thể kết nối máy chủ Strapi', true);
    return false;
  }
}

async function resetAccountPassword(key, id){
  const record = DB[key].find(r=>r.id===id);
  if(!record) return;
  const next = prompt(`Nhập mật khẩu mới cho tài khoản "${record.displayName || record.username}":`);
  if(next===null) return;
  if(next.length < 6){ showToast('Mật khẩu phải có ít nhất 6 ký tự', true); return; }
  const res = await apiFetch('/api/users/'+id, { method:'PUT', body: JSON.stringify({ password: next }) });
  if(!res.ok){ showToast('Không thể đặt lại mật khẩu', true); return; }
  showToast('Đã đặt lại mật khẩu');
}

async function tryRestoreSession(){
  const { jwt } = getStoredTokens();
  if(!jwt) return false;
  try{
    const res = await apiFetch('/api/users/me');
    if(!res.ok){ clearTokens(); return false; }
    CMS_CURRENT_USER = await res.json();
    return true;
  }catch(e){ return false; }
}

function renderAvatarMenu(){
  const label = (CMS_CURRENT_USER && (CMS_CURRENT_USER.displayName || CMS_CURRENT_USER.username)) || '';
  document.getElementById('avatarBtn').textContent = label ? label.trim().charAt(0).toUpperCase() : '?';
  document.getElementById('avatarMenuName').textContent = label;
}

function toggleAvatarMenu(e){
  e.stopPropagation();
  document.getElementById('avatarMenu').classList.toggle('on');
}

function closeAvatarMenu(){
  document.getElementById('avatarMenu').classList.remove('on');
}

async function showCmsApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  renderAvatarMenu();
  await refreshAccountsFromApi();
  const remoteKeys = Object.keys(COLLECTIONS).filter(k=>COLLECTIONS[k].remote && !COLLECTIONS[k].strapiUsers);
  await Promise.all([
    ...remoteKeys.map(k=>refreshRemoteCollection(k)),
    refreshSingletonFromApi('settings'),
    refreshSingletonFromApi('contact')
  ]);
  renderSidebar();
  renderTopbar();
  renderContent();
}

function showCmsLogin(message){
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const err = document.getElementById('loginError');
  err.textContent = message || '';
  err.style.display = message ? 'block' : 'none';
  document.getElementById('loginUsername').focus();
}

async function handleCmsLogin(e){
  e.preventDefault();
  const identifier = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const submitBtn = document.querySelector('#loginForm button[type=submit]');
  submitBtn.disabled = true;
  try{
    const res = await fetch(STRAPI_URL+'/api/auth/local', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ identifier, password })
    });
    const out = await res.json().catch(()=>({}));
    if(!res.ok){
      showCmsLogin(out.error && out.error.status===400 ? 'Tên đăng nhập hoặc mật khẩu không đúng' : 'Không thể đăng nhập. Vui lòng thử lại.');
      return;
    }
    storeTokens(out.jwt, out.refreshToken);
    CMS_CURRENT_USER = out.user;
    await showCmsApp();
  }catch(err){
    showCmsLogin('Không thể kết nối máy chủ Strapi'+(STRAPI_URL ? ' tại '+STRAPI_URL : ''));
  }finally{
    submitBtn.disabled = false;
  }
}

async function handleCmsLogout(e){
  e.preventDefault();
  try{ await apiFetch('/api/auth/logout', { method:'POST' }); }catch(e){}
  clearTokens();
  CMS_CURRENT_USER = null;
  location.reload();
}

function openChangePasswordModal(e){
  if(e) e.preventDefault();
  closeAvatarMenu();
  document.getElementById('pwCurrent').value = '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwConfirm').value = '';
  document.getElementById('pwModalOverlay').classList.add('on');
  document.getElementById('sidebar').classList.remove('open');
}

function closeChangePasswordModal(){
  document.getElementById('pwModalOverlay').classList.remove('on');
}

async function saveChangePassword(){
  const current = document.getElementById('pwCurrent').value;
  const next = document.getElementById('pwNew').value;
  const confirmVal = document.getElementById('pwConfirm').value;
  if(next.length < 6){ showToast('Mật khẩu mới phải có ít nhất 6 ký tự', true); return; }
  if(next !== confirmVal){ showToast('Xác nhận mật khẩu mới không khớp', true); return; }
  try{
    const res = await apiFetch('/api/auth/change-password', {
      method:'POST',
      body: JSON.stringify({ currentPassword: current, password: next, passwordConfirmation: confirmVal })
    });
    const out = await res.json().catch(()=>({}));
    if(!res.ok){
      const msg = out.error && out.error.message==='The provided current password is invalid'
        ? 'Mật khẩu hiện tại không đúng' : (out.error && out.error.message) || 'Không thể đổi mật khẩu';
      showToast(msg, true);
      return;
    }
    storeTokens(out.jwt, out.refreshToken);
    CMS_CURRENT_USER = out.user;
    closeChangePasswordModal();
    showToast('Đã đổi mật khẩu');
  }catch(e){
    showToast('Không thể kết nối máy chủ Strapi', true);
  }
}

document.getElementById('loginForm').addEventListener('submit', handleCmsLogin);
document.getElementById('logoutLink').addEventListener('click', handleCmsLogout);
document.getElementById('changePasswordLink').addEventListener('click', openChangePasswordModal);
document.getElementById('avatarBtn').addEventListener('click', toggleAvatarMenu);
document.addEventListener('click', (e)=>{ if(!document.getElementById('topbarUser').contains(e.target)) closeAvatarMenu(); });
document.getElementById('pwModalClose').addEventListener('click', closeChangePasswordModal);
document.getElementById('pwCancelBtn').addEventListener('click', closeChangePasswordModal);
document.getElementById('pwSaveBtn').addEventListener('click', saveChangePassword);
document.getElementById('pwModalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='pwModalOverlay') closeChangePasswordModal(); });

(async function initCms(){
  await loadDB();
  if(await tryRestoreSession()) showCmsApp(); else showCmsLogin();
})();

</script>
