# VBSF Web (static) — nguồn: index.html + pages/
# Deploy path trên server: /var/www/vbsf-web
#
# Cài đặt lần đầu:
#   sudo cp deploy/nginx/vbsf.biadi.vn.conf /etc/nginx/sites-available/vbsf.biadi.vn
#   sudo ln -s /etc/nginx/sites-available/vbsf.biadi.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vbsf.biadi.vn   # thêm HTTPS (tự sửa file này)

server {
    listen 80;
    listen [::]:80;
    server_name vbsf.biadi.vn;

    root /var/www/vbsf-web;
    index index.html;

    access_log /var/log/nginx/vbsf.biadi.vn.access.log;
    error_log  /var/log/nginx/vbsf.biadi.vn.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location /pages/ {
        try_files $uri =404;
    }

    # File tĩnh cache dài hạn (không có build hash nên giữ TTL vừa phải)
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
