# VBSF CMS (static) — nguồn: cms.html + cms-js/ — VÀ reverse-proxy Strapi backend
# (không cấp thêm domain riêng cho API, nên gộp chung dưới domain CMS này).
#
# Deploy path trên server: /var/www/vbsf-cms
# Strapi chạy bằng systemd service vbsf-strapi (không Docker) và chỉ lắng nghe
# 127.0.0.1:1337 — ra Internet bắt buộc phải đi qua nginx ở đây.
#
# Cài đặt lần đầu:
#   sudo cp deploy/nginx/cms.vbsf.vn.conf /etc/nginx/sites-available/cms.vbsf.vn
#   sudo ln -s /etc/nginx/sites-available/cms.vbsf.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cms.vbsf.vn   # thêm HTTPS (tự sửa file này)

upstream vbsf_strapi {
    server 127.0.0.1:1337;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.vbsf.vn;

    root /var/www/vbsf-cms;
    index cms.html;

    access_log /var/log/nginx/cms.vbsf.vn.access.log;
    error_log  /var/log/nginx/cms.vbsf.vn.error.log;

    # Strapi admin panel + API + các route nội bộ mà admin panel gọi tới.
    # Strapi tự trả 404 cho path không tồn tại nên không cần liệt kê chính xác
    # từng plugin route.
    location ~ ^/(admin|api|content-manager|content-type-builder|upload|users-permissions|i18n|email|uploads|documentation|_health)(/|$) {
        proxy_pass http://vbsf_strapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Trang CMS tĩnh (record-editor.js, tournament-editor.js, v.v.) — no-cache để
    # Cloudflare không tự áp default Browser Cache TTL (4h) cho các file .js,
    # khiến bản deploy mới không hiển thị ngay cho người dùng.
    location /cms-js/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /cms.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
