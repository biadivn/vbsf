# VBSF CMS (static) — nguồn: cms.html + cms-js/ — VÀ reverse-proxy Strapi backend
# (không cấp thêm domain riêng cho API, nên gộp chung dưới domain CMS này).
#
# Deploy path trên server: /var/www/vbsf-cms
# Strapi (Docker) lắng nghe ở 127.0.0.1:1337 (xem strapi-backend/docker-compose.yml).
#
# Cài đặt lần đầu:
#   sudo cp deploy/nginx/vbsf-cms.biadi.vn.conf /etc/nginx/sites-available/vbsf-cms.biadi.vn
#   sudo ln -s /etc/nginx/sites-available/vbsf-cms.biadi.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vbsf-cms.biadi.vn   # thêm HTTPS (tự sửa file này)

upstream vbsf_strapi {
    server 127.0.0.1:1337;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vbsf-cms.biadi.vn;

    root /var/www/vbsf-cms;
    index cms.html;

    access_log /var/log/nginx/vbsf-cms.biadi.vn.access.log;
    error_log  /var/log/nginx/vbsf-cms.biadi.vn.error.log;

    # Strapi admin panel + API + các route nội bộ mà admin panel gọi tới.
    # Strapi tự trả 404 cho path không tồn tại nên không cần liệt kê chính xác
    # từng plugin route.
    location ~ ^/(admin|api|content-manager|content-type-builder|upload|users-permissions|i18n|email|uploads|documentation|_health)(/|$) {
        proxy_pass http://vbsf_strapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Trang CMS tĩnh (record-editor.js, tournament-editor.js, v.v.)
    location /cms-js/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
