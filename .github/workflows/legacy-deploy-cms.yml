# SERVER CŨ (biadi.vn) — giữ nguyên cách deploy cũ: SSH vào server, chạy
# `git reset --hard origin/develop` trong checkout /opt/vbsf rồi rsync tại chỗ.
#
# Trigger là nhánh **develop**. Server mới (vbsf.vn) deploy từ **main** bằng
# deploy-cms.yml — hai đường hoàn toàn tách biệt: khác nhánh, khác environment
# (`production` cũ ↔ `production-vbsf-vn` mới), nên secret DEPLOY_HOST của bên
# này không bao giờ chạm vào bên kia.
name: Deploy VBSF CMS (server cũ)

on:
  push:
    branches: [develop]
    paths:
      - "cms.html"
      - "cms-js/**"
      - ".github/workflows/legacy-deploy-cms.yml"
      - ".github/scripts/**"
  workflow_dispatch: {}

concurrency:
  group: legacy-deploy-cms
  cancel-in-progress: true

jobs:
  # Backend phải lên trước frontend — xem .github/scripts/wait-for-strapi-deploy.sh.
  # Server cũ dùng workflow legacy-deploy-strapi.yml nên phải nói rõ tên và danh
  # sách đường dẫn kích hoạt nó, khác mặc định (đường của server mới).
  wait-strapi:
    name: Chờ Strapi cùng commit lên xong
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          STRAPI_WORKFLOW: legacy-deploy-strapi.yml
          STRAPI_PATHS_RE: '^(strapi-backend/|\.github/workflows/legacy-deploy-strapi\.yml$)'
        run: .github/scripts/wait-for-strapi-deploy.sh

  deploy:
    needs: wait-strapi
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Sync static files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REPO_PATH: ${{ vars.DEPLOY_REPO_PATH || '/opt/vbsf' }}
          CMS_ROOT: ${{ vars.CMS_ROOT || '/var/www/vbsf-cms' }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Cập nhật checkout Git trên server, rồi đồng bộ ra thư mục nginx serve
          # (chạy rsync trên chính server, tránh round-trip file qua runner).
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            exec 200>'$REPO_PATH/.deploy.lock'
            flock 200
            cd '$REPO_PATH'
            git fetch origin develop
            git reset --hard origin/develop
            mkdir -p '$CMS_ROOT/cms-js'
            # Gắn ?v=<commit ngắn> vào script src trong cms.html để Cloudflare luôn
            # coi mỗi bản deploy là URL mới — tránh phải reload nginx/purge cache
            # (deploy user không có quyền sudo trên server để tự reload nginx).
            BUILD_ID=\$(git rev-parse --short HEAD)
            sed \"s/__CMS_BUILD__/\$BUILD_ID/g\" '$REPO_PATH/cms.html' > /tmp/cms.deploy.html
            rsync -a /tmp/cms.deploy.html '$CMS_ROOT/cms.html'
            rsync -a --delete '$REPO_PATH/cms-js/' '$CMS_ROOT/cms-js/'
          "
