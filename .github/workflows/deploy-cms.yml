name: Deploy VBSF CMS

on:
  push:
    branches: [main]
    paths:
      - "cms.html"
      - "cms-js/**"
      - "deploy/nginx/vbsf-cms.biadi.vn.conf"
      - ".github/workflows/deploy-cms.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-cms
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Sync static files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REPO_PATH: ${{ vars.DEPLOY_REPO_PATH || '/opt/vbsf' }}
          CMS_ROOT: ${{ vars.CMS_ROOT || '/var/www/vbsf-cms' }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Cập nhật checkout Git trên server, rồi đồng bộ ra thư mục nginx serve
          # (chạy rsync trên chính server, tránh round-trip file qua runner).
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            exec 200>'$REPO_PATH/.deploy.lock'
            flock 200
            cd '$REPO_PATH'
            git fetch origin main
            git reset --hard origin/main
            mkdir -p '$CMS_ROOT/cms-js'
            rsync -a '$REPO_PATH/cms.html' '$CMS_ROOT/cms.html'
            rsync -a --delete '$REPO_PATH/cms-js/' '$CMS_ROOT/cms-js/'

            # Đồng bộ nginx config + reload nếu deploy user có quyền sudo không cần
            # mật khẩu cho đúng 2 lệnh này (xem README/setup). Nếu chưa cấp quyền,
            # bước này sẽ báo lỗi rõ ràng trong log CI thay vì treo chờ mật khẩu.
            if [ -f '$REPO_PATH/deploy/nginx/vbsf-cms.biadi.vn.conf' ]; then
              sudo -n cp '$REPO_PATH/deploy/nginx/vbsf-cms.biadi.vn.conf' /etc/nginx/sites-available/vbsf-cms.biadi.vn
              sudo -n nginx -t
              sudo -n systemctl reload nginx
            fi
          "
