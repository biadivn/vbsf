name: Deploy VBSF CMS

# Trang CMS tĩnh: runner chèn số build vào cms.html rồi rsync thẳng lên server.
# Phần backend (Strapi) deploy bằng workflow riêng: deploy-strapi.yml.
on:
  push:
    branches: [main]
    paths:
      - "cms.html"
      - "cms-js/**"
      - ".github/workflows/deploy-cms.yml"
      - ".github/scripts/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-cms
  cancel-in-progress: false

jobs:
  # Backend phải lên trước frontend — xem .github/scripts/wait-for-strapi-deploy.sh.
  wait-strapi:
    name: Chờ Strapi cùng commit lên xong
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-strapi-deploy.sh

  deploy:
    needs: wait-strapi
    runs-on: ubuntu-latest
    environment: production-vbsf-vn
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build id into cms.html
        run: |
          set -euo pipefail
          # Gắn ?v=<commit ngắn> vào script src trong cms.html để Cloudflare luôn
          # coi mỗi bản deploy là URL mới — tránh phải reload nginx/purge cache
          # (user deploy không có quyền sudo nginx trên server).
          sed "s/__CMS_BUILD__/${GITHUB_SHA::7}/g" cms.html > cms.deploy.html

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Sync static files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          CMS_ROOT: ${{ vars.CMS_ROOT || '/var/www/vbsf-cms' }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          target="$DEPLOY_USER@$DEPLOY_HOST:$CMS_ROOT"
          rsync -az -e "ssh -p $port" cms.deploy.html "$target/cms.html"
          rsync -az --delete -e "ssh -p $port" cms-js/ "$target/cms-js/"
