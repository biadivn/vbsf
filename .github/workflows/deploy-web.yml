name: Deploy VBSF Web

# Site tĩnh: runner tự chèn số build vào index.html rồi rsync thẳng lên server,
# server không chạy git/build gì cả.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "pages/**"
      - "site-js/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  verify:
    name: Unit test + security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: strapi-backend/package-lock.json

      - name: Install dependencies
        working-directory: strapi-backend
        run: npm ci

      # Gate trước khi deploy: coverage >= 80% và không có lỗ hổng high/critical.
      # Test của site-js nằm chung bộ test của strapi-backend.
      - name: Verify
        working-directory: strapi-backend
        run: npm run verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production-vbsf-vn
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build id into index.html
        run: |
          set -euo pipefail
          # Gắn ?v=<commit ngắn> vào script src để Cloudflare coi mỗi bản deploy
          # là URL mới. Không có bước này thì site-js/ mới deploy vẫn bị phục vụ
          # từ cache tới 4 giờ (Browser Cache TTL mặc định) — người dùng chạy mã
          # cũ mà không biết.
          sed "s/__WEB_BUILD__/${GITHUB_SHA::7}/g" index.html > index.deploy.html

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Sync static files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          WEB_ROOT: ${{ vars.WEB_ROOT || '/var/www/vbsf-web' }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          target="$DEPLOY_USER@$DEPLOY_HOST:$WEB_ROOT"
          rsync -az -e "ssh -p $port" index.deploy.html "$target/index.html"
          rsync -az --delete -e "ssh -p $port" pages/ "$target/pages/"
          # index.html nạp site-js/ (lớp đọc dữ liệu Strapi + đăng nhập hội
          # viên) — thiếu thư mục này thì site chạy như bản tĩnh cũ.
          rsync -az --delete -e "ssh -p $port" site-js/ "$target/site-js/"
