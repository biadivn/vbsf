services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: vbsf-strapi:local
    container_name: vbsf-strapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1337:1337"
    # strapi_uploads là dữ liệu KHÔNG thể mất (file upload thật của người dùng) —
    # bắt buộc phải là named volume, không mount vào layer container. strapi_data
    # (.tmp) chỉ là cache/cấu hình runtime nhưng vẫn persist để tránh mất tiến trình
    # build/cache giữa các lần restart container.
    volumes:
      - strapi_data:/opt/app/.tmp
      - strapi_uploads:/opt/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1337/_health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Postgres chạy cùng trong docker-compose (không phải MySQL/Postgres cài trên host) —
  # data lưu ở named volume postgres_data, persistent qua rebuild/restart container,
  # chỉ mất khi chủ động chạy `docker compose down -v`.
  postgres:
    image: postgres:16-alpine
    container_name: vbsf-strapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  strapi_data:
  strapi_uploads:
  postgres_data:
